<!doctype html>
<html lang="en" dir="ltr" data-palette="purple">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SCE · Smart Monitoring Center — LEAP 2026</title>
    <meta name="description" content="Saudi Council of Engineers national monitoring dashboards, LEAP 2026." />

    <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/img/favicon-512.png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <!-- Everything below is local. The wall has no internet: no CDN, no fonts
         from the network, no map tiles. -->
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/grid.css" />
    <link rel="stylesheet" href="assets/css/widget.css" />
    <link rel="stylesheet" href="assets/css/chart-dsl.css" />
    <link rel="stylesheet" href="assets/css/map.css" />
    <link rel="stylesheet" href="assets/css/library.css" />
    <link rel="stylesheet" href="assets/css/tooltip.css" />
    <link rel="stylesheet" href="assets/css/motion.css" />
    <link rel="stylesheet" href="assets/css/shell.css" />
    <link rel="stylesheet" href="assets/css/splash.css" />
    <!-- Last: every rule in it is an override of the ones above, for the
         tablet and the small screen. See core/viewport.js for the one place
         the breakpoints live. -->
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>

  <body>
    <div class="shell">
      <div class="ticker" id="ticker"></div>

      <main class="stage" id="stage"></main>

      <!-- Presentation mode's only chrome: where the cycle has got to, from
           the first screen to the last. Built by shell.js, which knows the
           dwell of every board and scene; hidden until data-clean. -->
      <div class="cycle" id="cycle" aria-hidden="true">
        <span class="cycle-fill"></span>
      </div>

      <header class="hdr">
        <!-- Presentation mode (the "/" key). With the chrome hidden the wall
             still has to say whose board it is, so the header collapses to the
             SCE mark alone, flanked by the centre's line in both languages —
             English on the reading-start side, Arabic on the other. Kept as its
             own overlay rather than restyling .hdr-brand, so nothing about the
             normal header moves when the key is pressed. -->
        <div class="hdr-clean" aria-hidden="true">
          <span class="hdr-clean-line" lang="en" dir="ltr">Engineering the Future</span>
          <img class="hdr-clean-logo" src="assets/img/sce-logo.svg" alt="" />
          <span class="hdr-clean-line" lang="ar" dir="rtl">نهندس المستقبل...</span>
        </div>

        <!-- The wall's own identity, as the source dashboards printed it: the
             centre's name with the other language underneath, and — while the
             Big Screen is on — its three scenes beside it. -->
        <div class="hdr-brand">
          <img class="hdr-logo" src="assets/img/sce-logo.svg" alt="Saudi Council of Engineers" />
          <div class="hdr-title">
            <div class="hdr-title-main" data-i18n="app.title"></div>
            <div class="hdr-title-alt" data-i18n-gloss="app.title"></div>
          </div>
          <div class="chips scenes" id="scenes" hidden></div>
        </div>

        <div class="dock">
          <button class="dock-btn nav-play" id="navPlay" type="button" aria-label="Play or pause the slideshow">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
          </button>

          <nav class="nav" id="nav"></nav>

          <button class="dock-btn nav-lang" id="navLang" type="button" aria-label="Switch language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <line x1="2" y1="12" x2="22" y2="12" />
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            </svg>
          </button>
        </div>

        <div class="hdr-meta">
          <!-- Online-updates indicator. Not a Figma component: the customer
               asked for the wall to say, without words, that it is being
               watched rather than printed. It states nothing about the data
               and carries no figure — the pulse is the whole message. -->
          <div class="live">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="live-label" data-i18n="live.label"></span>
          </div>

          <div class="settings">
            <!-- Figma node 5065:82983: the same "Circle Button" component as
                 the dock's play and globe, standing alone in the board's far
                 corner — hence .dock-btn here rather than a style of its own. -->
            <button class="dock-btn hdr-settings" id="settingsBtn" type="button" aria-label="Settings" aria-haspopup="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.66.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.52.02.66-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"
                />
              </svg>
            </button>

            <div class="settings-panel" id="settingsPanel" hidden>
              <label class="settings-row">
                <input class="settings-check" id="setAutoplay" type="checkbox" />
                <span>Autoplay slideshow</span>
              </label>
              <label class="settings-row">
                <input class="settings-check" id="setTickerVisible" type="checkbox" />
                <span>Show ticker</span>
              </label>
              <label class="settings-row">
                <input class="settings-check" id="setTickerPaused" type="checkbox" />
                <span>Pause ticker</span>
              </label>
              <label class="settings-row">
                <input class="settings-check" id="setSplashEnabled" type="checkbox" />
                <span>Show splash screen</span>
              </label>
              <!-- Not a checkbox: the ground is a choice between named
                   palettes, not a flag, so it gets a segmented track like the
                   chips elsewhere on the board. Radios, so arrow keys move
                   between them without any script of ours. -->
              <div class="settings-row settings-row--choice" role="group" aria-label="Palette">
                <span>Palette</span>
                <div class="settings-seg">
                  <label class="settings-seg__opt">
                    <input type="radio" name="palette" value="green" />
                    <span>Green</span>
                  </label>
                  <label class="settings-seg__opt">
                    <input type="radio" name="palette" value="blue" />
                    <span>Blue</span>
                  </label>
                  <label class="settings-seg__opt">
                    <input type="radio" name="palette" value="purple" />
                    <span>Purple</span>
                  </label>
                </div>
              </div>
              <button class="settings-action" id="reset" type="button">Reset layout</button>
            </div>
          </div>
        </div>
      </header>
    </div>

    <!-- The attract screen: Figma «Sce Dashboards for LEAP '26» 38:357 and
         its three narrower siblings, reproduced 1:1. Bilingual by design, so
         it carries no language switch; the whole surface is the start button
         (.splash-start), which also keeps the id the capture tools click. -->
    <section class="splash" id="splash">
      <div class="cover">
        <div class="cover__bg" aria-hidden="true"></div>
        <canvas class="code" aria-hidden="true"></canvas>
        <div class="cover__fade" aria-hidden="true"></div>

        <div class="cover__frame">
          <!-- EN block — Figma 38:449 «Group 3». dir="ltr" is explicit for
               the same reason the AR block below declares dir="rtl": the cover
               shows both languages at once whatever the app's locale is, so
               neither block may take its direction from <html>. Without it the
               Arabic locale right-aligned this English text inside its own
               fixed-width box — the box stays put (every coordinate here is a
               physical `left`), only the lines slid across it. -->
          <h1 class="en-title" dir="ltr" lang="en" data-trim data-node="38:455">
            <span class="en-title__gold"><i class="fill">Engineering</i></span>
            <span class="en-title__white">the Future</span>
          </h1>

          <p class="en-sub" dir="ltr" lang="en" data-trim data-node="38:456">Mapped Across the Kingdom</p>

          <div class="powered" dir="ltr" lang="en" data-node="38:450">
            <p class="powered__label" data-trim data-node="38:451">powered by</p>
            <img class="powered__logo" data-node="38:452" src="assets/img/cover/axion.svg" alt="Axion" width="186" height="32" />
          </div>

          <!-- AR block — Figma 38:390 «Group 4». On a phone the logo moves to
               the centre of the frame and takes a markedly larger shadow, which
               is a separate export (38:1102). -->
          <div class="sce" data-node="38:391 / 38:1102">
            <picture>
              <source media="(max-aspect-ratio: 4/5) and (max-width: 599px)" srcset="assets/img/cover/sce-phone.svg" />
              <img class="sce__img" src="assets/img/cover/sce.svg" alt="Saudi Council of Engineers" />
            </picture>
          </div>

          <h2 class="ar-title" dir="rtl" lang="ar" data-node="38:448">
            <span class="ar-title__gold"><i class="fill">نهندس</i></span>
            <span class="ar-title__white">المستقبل...</span>
          </h2>

          <p class="ar-sub" data-trim dir="rtl" lang="ar" data-node="38:447">على خريطة الوطن</p>
        </div>
      </div>

      <button class="splash-start" id="splashStart" type="button" aria-label="Enter the dashboards"></button>

      <!-- Tablet only: a touch screen gets an explicit target instead of the
           invisible full-surface button and the 10s auto-advance. Shown by
           core/splash.js, which stamps data-cta on the section. -->
      <button class="splash-cta" id="splashEnter" type="button">
        <span class="splash-cta__en" dir="ltr" lang="en">Enter the dashboards</span>
        <span class="splash-cta__ar" dir="rtl" lang="ar">الدخول إلى اللوحات</span>
      </button>
    </section>

    <script src="assets/js/data/leap_data.js"></script>
    <script src="assets/js/data/ksa-geo.js"></script>
    <script src="assets/js/data/ksa-basemap.js"></script>
    <!-- Before anything that reads --u or lays a board out: it stamps the
         layout mode on <html>, which every stylesheet below keys off. -->
    <script src="assets/js/core/viewport.js"></script>
    <script src="assets/js/core/i18n.js"></script>
    <script src="assets/js/core/format.js"></script>
    <script src="assets/js/data/labels.js"></script>
    <script src="assets/js/data/derive.js"></script>
    <script src="assets/js/core/counter.js"></script>
    <script src="assets/js/core/tooltip.js"></script>
    <script src="assets/js/core/pill.js"></script>
    <script src="assets/js/core/chart-dsl.js"></script>
    <script src="assets/js/core/map.js"></script>
    <script src="assets/js/core/grid.js"></script>
    <script src="assets/js/core/motion.js"></script>
    <script src="assets/js/core/board.js"></script>
    <script src="assets/js/boards/kit.js"></script>
    <script src="assets/js/boards/ecosystem.js"></script>
    <!-- profession.js and operations.js define the widget sets the Big Screen
         mounts as its second and third scenes, so both must load before it. -->
    <script src="assets/js/boards/profession.js"></script>
    <script src="assets/js/boards/operations.js"></script>
    <script src="assets/js/boards/bigscreen.js"></script>
    <script src="assets/js/boards/library.js"></script>
    <script src="assets/js/boards/field.js"></script>
    <script src="assets/js/core/shell.js"></script>
    <script src="assets/js/core/cover-field.js"></script>
    <script src="assets/js/core/splash.js"></script>
    <script>
      Shell.init();
      Splash.init();
    </script>
  </body>
</html>
