<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCE · Smart Monitoring Center — LEAP 2026</title>
    <meta name="description" content="Saudi Council of Engineers national monitoring dashboards, LEAP 2026." />

    <link rel="icon" href="assets/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/img/favicon-512.png" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

    <!-- Everything below is local. The wall has no internet: no CDN, no fonts
         from the network, no map tiles. -->
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/grid.css" />
    <link rel="stylesheet" href="assets/css/widget.css" />
    <link rel="stylesheet" href="assets/css/chart-dsl.css" />
    <link rel="stylesheet" href="assets/css/map.css" />
    <link rel="stylesheet" href="assets/css/library.css" />
    <link rel="stylesheet" href="assets/css/tooltip.css" />
    <link rel="stylesheet" href="assets/css/motion.css" />
    <link rel="stylesheet" href="assets/css/shell.css" />
    <link rel="stylesheet" href="assets/css/splash.css" />
  </head>

  <body>
    <div class="shell">
      <div class="ticker" id="ticker"></div>

      <main class="stage" id="stage"></main>

      <header class="hdr">
        <!-- The wall's own identity, as the source dashboards printed it: the
             centre's name with the other language underneath, and — while the
             Big Screen is on — its three scenes beside it. -->
        <div class="hdr-brand">
          <img class="hdr-logo" src="assets/img/sce_logo_dark.png" alt="Saudi Council of Engineers" />
          <div class="hdr-title">
            <div class="hdr-title-main" data-i18n="app.title"></div>
            <div class="hdr-title-alt" data-i18n-gloss="app.title"></div>
          </div>
          <div class="chips scenes" id="scenes" hidden></div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-play" id="navPlay" type="button" aria-label="Play or pause the slideshow">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z" /></svg>
          </button>
        </nav>

        <div class="hdr-meta">
          <div class="hdr-event">
            <div class="hdr-event-name" data-i18n="hdr.event"></div>
            <div class="hdr-event-clock ax-num" id="clock" dir="ltr">·</div>
          </div>

          <button class="hdr-reset" id="reset" type="button">Reset layout</button>

          <div class="settings">
            <button class="hdr-settings" id="settingsBtn" type="button" aria-label="Settings" aria-haspopup="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.66.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.25.42.5.42h3.84c.25 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.52.02.66-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"
                />
              </svg>
            </button>

            <div class="settings-panel" id="settingsPanel" hidden>
              <label class="settings-row">
                <input class="settings-check" id="setAutoplay" type="checkbox" />
                <span>Autoplay slideshow</span>
              </label>
              <label class="settings-row">
                <input class="settings-check" id="setTickerVisible" type="checkbox" />
                <span>Show ticker</span>
              </label>
              <label class="settings-row">
                <input class="settings-check" id="setTickerPaused" type="checkbox" />
                <span>Pause ticker</span>
              </label>
              <label class="settings-row">
                <input class="settings-check" id="setSplashEnabled" type="checkbox" />
                <span>Show splash screen</span>
              </label>
            </div>
          </div>

          <!-- Language switch. Arabic is a full second locale, not a label
               swap: it flips the document direction, which moves every chart's
               category axis to the other side. -->
          <div class="lang" id="lang"></div>
        </div>
      </header>
    </div>

    <section class="splash" id="splash">
      <canvas class="splash-canvas" id="splashCanvas"></canvas>
      <div class="splash-veil"></div>

      <!-- The attract screen carries its own language switch: an Arabic-reading
           visitor should not have to start in English to find the other one. -->
      <div class="lang lang--splash"></div>

      <div class="splash-inner">
        <img class="splash-logo" src="assets/img/sce_logo_dark.png" alt="Saudi Council of Engineers" />
        <div class="splash-eyebrow" data-i18n="splash.eyebrow"></div>
        <h1 class="splash-title">
          <span data-i18n="splash.title1"></span><br /><b data-i18n="splash.title2"></b>
        </h1>
        <p class="splash-sub" data-i18n="splash.sub"></p>

        <button class="splash-cta" id="splashStart" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <span data-i18n="splash.cta"></span>
        </button>

        <div class="splash-stats">
          <div>
            <div class="splash-stat-value ax-num" id="splashStat1" dir="ltr">—</div>
            <div class="splash-stat-label" data-i18n="splash.stat1"></div>
          </div>
          <div>
            <div class="splash-stat-value ax-num" id="splashStat2" dir="ltr">—</div>
            <div class="splash-stat-label" data-i18n="splash.stat2"></div>
          </div>
          <div>
            <div class="splash-stat-value ax-num" id="splashStat3" dir="ltr">—</div>
            <div class="splash-stat-label" data-i18n="splash.stat3"></div>
          </div>
        </div>
      </div>

      <div class="splash-foot">
        Powered by
        <svg class="axion-mark" viewBox="0 0 1391 234" aria-hidden="true" focusable="false">
          <path
            d="M153.472 4.33727L303.275 213.193L389.353 123.445L344.312 76.069H290.597V4.33727H344.312C354.766 4.33727 363.885 5.44939 371.67 7.67362C379.678 9.89786 386.795 12.9006 393.023 16.6818C399.251 20.2406 404.923 24.4666 410.038 29.36C415.154 34.0309 420.159 39.0354 425.052 44.3736L445.07 65.7263L503.79 4.33727H606.884L495.783 119.775L530.815 156.809H593.538V228.541H530.815C522.362 228.541 514.578 227.651 507.46 225.871C500.343 224.092 493.781 221.757 487.776 218.865C481.77 215.751 476.21 212.192 471.094 208.189C466.2 203.963 461.53 199.514 457.081 194.843L440.399 177.494L391.355 228.541H215.529L168.152 163.482H80.7399V228.541H0V159.478C0 137.903 5.5606 122 16.6818 111.768C27.803 101.537 43.9287 96.4208 65.059 96.4208H119.108L52.0472 4.33727H153.472ZM720.32 228.541H639.58V4.33727H720.32V228.541ZM907.823 67.3944C884.691 67.3944 867.787 71.3981 857.11 79.4053C846.434 87.4126 841.096 99.7571 841.096 116.439C841.096 133.121 846.434 145.576 857.11 153.806C867.787 162.036 884.691 166.151 907.823 166.151C931.4 166.151 948.638 162.036 959.537 153.806C970.435 145.576 975.885 133.121 975.885 116.439C975.885 99.7571 970.324 87.4126 959.203 79.4053C948.082 71.3981 930.955 67.3944 907.823 67.3944ZM907.489 0C930.399 0 951.196 2.44666 969.879 7.33999C988.785 12.2333 1004.91 19.4621 1018.26 29.0263C1031.82 38.5905 1042.28 50.6014 1049.62 65.059C1056.96 79.2941 1060.63 95.8647 1060.63 114.771C1060.63 135.011 1057.07 152.583 1049.95 167.485C1042.83 182.388 1032.6 194.732 1019.26 204.519C1006.13 214.305 990.12 221.645 971.214 226.539C952.53 231.21 931.511 233.545 908.157 233.545C884.802 233.545 863.672 231.21 844.766 226.539C826.082 221.645 810.068 214.305 796.722 204.519C783.599 194.732 773.479 182.388 766.362 167.485C759.244 152.583 755.685 135.011 755.685 114.771C755.685 76.9587 767.918 48.3772 792.385 29.0263C816.852 9.67544 855.22 0 907.489 0ZM1390.59 4.33727V228.541H1340.88C1333.1 228.541 1326.31 227.984 1320.53 226.872C1314.97 225.76 1309.85 224.092 1305.18 221.868C1300.73 219.644 1296.51 216.863 1292.51 213.527C1288.72 209.968 1284.72 205.965 1280.49 201.516L1188.74 104.094V228.541H1117.35V74.0672H1072.31V4.33727H1144.37C1154.6 4.33727 1163.83 5.11576 1172.06 6.67273C1180.51 8.22969 1188.3 10.6763 1195.42 14.0127C1202.76 17.1266 1209.65 21.2415 1216.1 26.3572C1222.78 31.2506 1229.45 37.256 1236.12 44.3736L1318.86 130.785V4.33727H1390.59Z"
            fill="currentColor" />
        </svg>
      </div>
    </section>

    <script src="assets/js/data/leap_data.js"></script>
    <script src="assets/js/data/ksa-geo.js"></script>
    <script src="assets/js/data/ksa-basemap.js"></script>
    <script src="assets/js/core/i18n.js"></script>
    <script src="assets/js/core/format.js"></script>
    <script src="assets/js/data/labels.js"></script>
    <script src="assets/js/data/derive.js"></script>
    <script src="assets/js/core/counter.js"></script>
    <script src="assets/js/core/tooltip.js"></script>
    <script src="assets/js/core/chart-dsl.js"></script>
    <script src="assets/js/core/map.js"></script>
    <script src="assets/js/core/grid.js"></script>
    <script src="assets/js/core/motion.js"></script>
    <script src="assets/js/core/board.js"></script>
    <script src="assets/js/boards/kit.js"></script>
    <script src="assets/js/boards/ecosystem.js"></script>
    <!-- profession.js and operations.js define the widget sets the Big Screen
         mounts as its second and third scenes, so both must load before it. -->
    <script src="assets/js/boards/profession.js"></script>
    <script src="assets/js/boards/operations.js"></script>
    <script src="assets/js/boards/bigscreen.js"></script>
    <script src="assets/js/boards/library.js"></script>
    <script src="assets/js/boards/field.js"></script>
    <script src="assets/js/core/shell.js"></script>
    <script src="assets/js/core/splash.js"></script>
    <script>
      document.getElementById('splashStat1').textContent = Fmt.grouped(Data.head.eco);
      document.getElementById('splashStat2').textContent = Fmt.grouped(Data.head.reg);
      document.getElementById('splashStat3').textContent = Fmt.grouped(Data.tuv.surveyed);

      Shell.init();
      Splash.init();
    </script>
  </body>
</html>
