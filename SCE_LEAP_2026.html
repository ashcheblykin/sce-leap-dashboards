    <script>
/* Shared board helpers. Nothing here decides what a panel says — that is each
   board file's job — it only saves every one of them from restating the same
   plumbing: the tone palette, the [label, value] -> chart-spec adapters, and
   the map host that has to survive a view switch without being rebuilt. */

(function (global) {
  'use strict';

  /* One palette, defined by the chart DSL. */
  var T = Chart.TONE;

  /* Register statuses carry a fixed colour across every panel that shows them,
     so "green means in good standing" holds on all four boards. */
  var STATUS_TONE = {
    active: T.green,
    near_expiry: T.gold,
    expired: T.blue,
    frozen: T.purple,
  };

  var STATUS_KEY = {
    active: 's.active',
    near_expiry: 's.near',
    expired: 's.expired',
    frozen: 's.frozen',
  };

  var CLASS_TONE = { Engineer: T.cy, Technician: T.green, Specialist: T.gold };
  var CLASS_KEY = {
    Engineer: 's.engineers',
    Technician: 's.technicians',
    Specialist: 's.specialists',
  };

  var GRADE_TONE = {
    Engineer: T.cy,
    Professional: T.green,
    Associate: T.gold,
    Consultant: T.purple,
  };
  var GRADE_KEY = {
    Engineer: 's.engineer',
    Professional: 's.professional',
    Associate: 's.associate',
    Consultant: 's.consultant',
  };

  /* LEAP.cls labels the three classes in the plural; the register rows use the
     singular. Both spellings map to the same message key. */
  var CLS_KEY = {
    Engineers: 's.engineers',
    Technicians: 's.technicians',
    Specialists: 's.specialists',
  };

  var WINDOW_KEY = { '0-30': 's.d30', '31-60': 's.d60', '61-90': 's.d90' };

  function t(key, vars) {
    return I18N.t(key, vars);
  }

  /** [[arabicOrKey, value]] -> progress-bars data, one tone for the list. */
  function barData(rows, tone) {
    return rows.map(function (r) {
      return { label: r[0], value: r[1], color: tone };
    });
  }

  /** [[label, value]] -> a single-series cartesian spec on a band axis. */
  function barSeries(rows, tone, key) {
    return [
      {
        key: key || 'v',
        type: 'bar',
        color: tone,
        data: rows.map(function (r) {
          return { x: r[0], y: r[1] };
        }),
      },
    ];
  }

  /* --- Map host ---
     The map builds its SVG once and then only swaps markers, so the element it
     lives in has to outlive a chip switch. Stashing it on the body element is
     the same trick the prototypes used, minus Leaflet. */
  function mapView(el, mode) {
    if (!el._map) {
      Chart.unmount(el);
      el.innerHTML = '';
      var host = document.createElement('div');
      el.appendChild(host);
      el._map = AxMap.create(host);
    }
    el._map.render(mode);
  }

  /** City bubbles: `valueIndex` 3 is workforce, 4 is SCE-registered. */
  function cityPoints(valueIndex, format) {
    return Data.cities.map(function (c) {
      return [
        c[1],
        c[2],
        c[valueIndex],
        Labels.t(c[0]) + ' · ' + (format || Fmt.grouped)(c[valueIndex]),
      ];
    });
  }

  global.Kit = {
    T: T,
    STATUS_TONE: STATUS_TONE,
    STATUS_KEY: STATUS_KEY,
    CLASS_TONE: CLASS_TONE,
    CLASS_KEY: CLASS_KEY,
    CLS_KEY: CLS_KEY,
    GRADE_TONE: GRADE_TONE,
    GRADE_KEY: GRADE_KEY,
    WINDOW_KEY: WINDOW_KEY,
    t: t,
    barData: barData,
    barSeries: barSeries,
    mapView: mapView,
    cityPoints: cityPoints,
  };
})(window);

    <script>
/* Board 2 — Profession.

   No map: this board is the register itself, so it gets the two chart kinds
   Axion has and the SCE prototypes did not — a sankey for the whole 1,116,186
   memberships flowing from class to status, and a sunburst for the engineer
   grade rollups. Both totals reconcile exactly (register total = head.reg;
   grade total = the Engineers class), which is what makes them safe to show
   large. */

(function (global) {
  'use strict';

  var T = Kit.T;
  var t = Kit.t;

  /** Sankey: three class nodes on the left, four status nodes on the right. */
  function registerFlow() {
    var nodes = [];
    var index = {};
    Data.register.classOrder.forEach(function (cls) {
      index['c:' + cls] = nodes.length;
      nodes.push({ label: t(Kit.CLASS_KEY[cls]), color: Kit.CLASS_TONE[cls], layer: 0 });
    });
    Data.register.statusOrder.forEach(function (status) {
      index['s:' + status] = nodes.length;
      nodes.push({ label: t(Kit.STATUS_KEY[status]), color: Kit.STATUS_TONE[status], layer: 1 });
    });

    var links = [];
    Data.register.classOrder.forEach(function (cls) {
      Data.register.statusOrder.forEach(function (status) {
        var v = Data.register.cross[cls][status];
        if (!v) return;
        links.push({
          source: index['c:' + cls],
          target: index['s:' + status],
          value: v,
          color: Kit.CLASS_TONE[cls],
        });
      });
    });
    return { nodes: nodes, links: links };
  }

  /** Sunburst: engineer grade in the inner ring, its statuses outside it. */
  function gradeRings() {
    return Data.gradeOrder.map(function (grade) {
      var row = Data.gradeCross[grade] || {};

      Data.register.statusOrder.forEach(function (s) {
        total += row[s] || 0;

      return {
        label: t(Kit.GRADE_KEY[grade]),
        value: total,
        color: Kit.GRADE_TONE[grade],
        children: Data.register.statusOrder
          .filter(function (s) {
            return row[s];
          })
          .map(function (s) {
            return { label: t(Kit.STATUS_KEY[s]), value: row[s], color: Kit.STATUS_TONE[s] };

    <script>
/* Application shell: navigation, the language switch, the 45-second slideshow,
   the ticker, and the idle return to the splash.

   The type-scale keys deserve a note. The wall's real viewing distance is not
   known until the stand is built, and it is the one thing nobody can fix from a
   laptop, so `[` and `]` nudge `--u-scale` live and the choice is remembered.
   Everything on the board — type, padding, chart geometry — derives from that
   one number, so a single keypress rescales the whole thing coherently. */

(function (global) {
  'use strict';

  var SLIDE_MS = 45000;
  var INTERACTION_PAUSE_MS = 90000;
  var IDLE_TO_SPLASH_MS = 300000;

  var SCALE_STORAGE = 'sce.leap.uscale';
  var SCALE_MIN = 0.9;
  var SCALE_MAX = 2;
  var SCALE_STEP = 0.05;
  var SCALE_DEFAULT = 1.3;

  /* Two separate clocks. `holdUntil` parks the slideshow while somebody is
     working the board; `lastInteraction` decides when the wall goes back to
     the SCE attract screen. Sharing one clock made the first board sit for 90
     seconds because pressing Start counts as interaction. */
  var holdUntil = 0;
  var lastInteraction = 0;

  var BOARDS = [
    global.BOARD_ECOSYSTEM,
    global.BOARD_PROFESSION,
    global.BOARD_OPERATIONS,
    global.BOARD_FIELD,
  ];

  var stage = document.getElementById('stage');
  var navHost = document.getElementById('nav');
  var playBtn = document.getElementById('navPlay');
  var clockEl = document.getElementById('clock');
  var resetBtn = document.getElementById('reset');
  /* Two hosts: the header's and the splash's. Both are built from the same
     list, so the switch is in the same place in the same shape wherever the
     wall happens to be. */
  var langHosts = document.querySelectorAll('.lang');

  var boards = [];
  var current = -1;
  var playing = true;
  var switching = false;
  var slideStartedAt = 0;
  var navFills = [];

  /* --- Type scale --- */
  var scale = SCALE_DEFAULT;
  try {
    var savedScale = parseFloat(localStorage.getItem(SCALE_STORAGE));
    if (isFinite(savedScale) && savedScale >= SCALE_MIN && savedScale <= SCALE_MAX) {
      scale = savedScale;
    }
  } catch (e) {
    /* private mode */
  }

  function applyScale() {
    document.documentElement.style.setProperty('--u-scale', scale.toFixed(2));
    /* Chart constants derive from --u, so the DSL has to re-read it and every
       mounted chart has to repaint at the new geometry. */
    Chart.refreshUnit();
    for (var i = 0; i < boards.length; i++) if (boards[i]) redrawCharts(boards[i].surface);
  }

  function nudgeScale(delta) {
    var next = Math.round(Math.min(SCALE_MAX, Math.max(SCALE_MIN, scale + delta)) * 100) / 100;
    if (next === scale) return;
    scale = next;
    try {
      localStorage.setItem(SCALE_STORAGE, String(scale));
    } catch (e) {
      /* ignore */
    }
    applyScale();
    flash(Math.round(scale * 100) + '%');
  }

  /* A resize changes --u, so the observer would repaint anyway; a scale change
     does not, so nudge each chart's box by a hair to make it deliver. */
  function redrawCharts(surface) {
    var areas = surface.querySelectorAll('.ax-chart-area');
    for (var i = 0; i < areas.length; i++) {
      var a = areas[i];
      a.style.paddingRight = '0.01px';
      void a.offsetWidth;
      a.style.paddingRight = '';
    }
  }

  var toast = null;
  function flash(message) {
    if (!toast) {
      toast = document.createElement('div');
      toast.className = 'shell-toast';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.setAttribute('data-on', '');
    clearTimeout(flash._timer);
    flash._timer = setTimeout(function () {
      toast.removeAttribute('data-on');
    }, 1100);
  }

  /* Both grid axes are derived in CSS from the surface's own container-query
     size, so the board always fills its stage exactly. */
  function measure() {
    document.documentElement.style.setProperty('--grid-cols', AxGrid.COLS);
    document.documentElement.style.setProperty('--grid-rows', AxGrid.ROWS);
  }

  function noteInteraction() {
    lastInteraction = Date.now();
    holdUntil = lastInteraction + INTERACTION_PAUSE_MS;
  }

  /* --- Navigation --- */
  function buildNav() {
    var html = '';
    for (var i = 0; i < BOARDS.length; i++) {
      html +=
        '<button class="nav-item" type="button" data-board="' +
        i +
        '"><span class="nav-item-fill"></span>' +
        Fmt.escapeHtml(I18N.t(BOARDS[i].labelKey)) +
        '</button>';
    }
    var existing = navHost.querySelectorAll('.nav-item');
    for (var e = 0; e < existing.length; e++) existing[e].remove();
    navHost.insertAdjacentHTML('afterbegin', html);
    navFills = navHost.querySelectorAll('.nav-item-fill');
    if (current >= 0) markNav(current);
  }

  function markNav(index) {
    var items = navHost.querySelectorAll('.nav-item');
    for (var i = 0; i < items.length; i++) {
      if (i === index) items[i].setAttribute('data-on', '');
      else items[i].removeAttribute('data-on');
      navFills[i].style.width = '0%';
    }
  }

  /* --- Language ---
     Switching locale rebuilds the boards: every label, every chip and every
     chart spec is produced from the message table at render time, and the RTL
     flip changes which side an axis lands on. Layouts survive (they live in
     localStorage per board) and so does the board you were on. */
  var LOCALES = [
    { code: 'en', label: 'EN' },
    { code: 'ar', label: 'ع' },
  ];

  function buildLang() {
    for (var h = 0; h < langHosts.length; h++) {
      var host = langHosts[h];
      host.innerHTML = '';
      for (var i = 0; i < LOCALES.length; i++) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lang-btn' + (LOCALES[i].code === I18N.locale ? ' is-on' : '');
        btn.setAttribute('data-locale', LOCALES[i].code);
        btn.setAttribute('lang', LOCALES[i].code);
        btn.setAttribute('aria-label', I18N.t('ctl.lang') + ': ' + LOCALES[i].label);
        btn.textContent = LOCALES[i].label;
        host.appendChild(btn);
      }
    }
  }

  function relocalize() {
    var keep = current;
    for (var i = 0; i < boards.length; i++) {
      if (boards[i]) boards[i].destroy();
      boards[i] = null;
    }
    current = -1;
    buildNav();
    buildLang();
    buildTicker();
    localizeStatic();
    if (keep >= 0) show(keep);
  }

  /** The parts of index.html that are markup rather than board output. */
  function localizeStatic() {
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].textContent = I18N.t(nodes[i].getAttribute('data-i18n'));
    }
    var glosses = document.querySelectorAll('[data-i18n-gloss]');
    for (var g = 0; g < glosses.length; g++) {
      glosses[g].textContent = I18N.other(glosses[g].getAttribute('data-i18n-gloss'));
    }
    resetBtn.textContent = I18N.t('ctl.reset');
    playBtn.setAttribute('aria-label', I18N.t(playing ? 'ctl.pause' : 'ctl.play'));
  }

  /* --- Board switching --- */
  function mount(index) {
    if (boards[index]) return boards[index];
    var board = Board.create(BOARDS[index], stage);
    BOARDS[index].onInteract = noteInteraction;
    boards[index] = board;
    return board;
  }

  function show(index) {
    if (switching || index === current) return;
    switching = true;

    var next = mount(index);
    next.surface.style.display = 'none';

    function reveal() {
      if (current >= 0 && boards[current]) boards[current].surface.style.display = 'none';
      current = index;
      next.surface.style.display = '';
      measure();
      markNav(index);
      Motion.enter(next.surface);
      slideStartedAt = Date.now();
      switching = false;
    }

    if (current >= 0 && boards[current]) {
      Motion.exit(boards[current].surface, reveal);
      return;
    }
    reveal();
  }

  function advance() {
    show((current + 1) % BOARDS.length);
  }

  /* --- Slideshow --- */
  function setPlaying(on) {
    playing = on;
    if (on) {
      playBtn.setAttribute('data-playing', '');
      slideStartedAt = Date.now();
    } else {
      playBtn.removeAttribute('data-playing');
      for (var i = 0; i < navFills.length; i++) navFills[i].style.width = '0%';
    }
    playBtn.setAttribute('aria-label', I18N.t(on ? 'ctl.pause' : 'ctl.play'));
  }

  function slideshowTick() {
    var now = Date.now();

    if (global.Splash.visible()) {
      lastInteraction = now;
      return;
    }

    if (now - lastInteraction > IDLE_TO_SPLASH_MS) {
      global.Splash.show();
      return;
    }

    if (!playing || switching || now < holdUntil) {
      if (!switching && current >= 0 && navFills[current]) {
        navFills[current].style.width = '0%';
      }
      // Whatever is on screen gets a full slot once the hold lifts.
      slideStartedAt = now;
      return;
    }

    var elapsed = now - slideStartedAt;
    if (current >= 0 && navFills[current]) {
      navFills[current].style.width = Math.min(100, (elapsed / SLIDE_MS) * 100) + '%';
    }
    if (elapsed >= SLIDE_MS) advance();
  }

  /* --- Ticker ---
     Two identical halves translated by exactly -50% never show a gap. Every
     figure is read from Data, and the wording is a message key, so the Arabic
     board gets an Arabic crawl. */
  function buildTicker() {
    var facts = [
      ['b', Fmt.grouped(Data.head.eco), I18N.t('t.eco')],
      ['g', Fmt.grouped(Data.head.reg), I18N.t('t.reg')],
      ['b', Data.head.offices, I18N.t('t.offices')],
      ['g', Fmt.pct(Data.tuv.scecov), I18N.t('t.scecov')],
      ['b', Fmt.grouped(Data.head.proact), I18N.t('t.proact')],
      ['g', Fmt.grouped(Data.head.renewengage), I18N.t('t.engage')],
      ['y', Fmt.sar(Data.head.enforced), I18N.t('t.money', { n: Fmt.sar(Data.head.collected) })],
      ['b', Fmt.grouped(Data.tuv.surveyed), I18N.t('t.surveyed', { n: Data.tuv.regions })],
      ['g', Fmt.grouped(Data.register.active), I18N.t('t.active')],
      ['b', Fmt.grouped(Data.tuv.workers), I18N.t('t.workers')],
      ['y', Fmt.grouped(Data.head.saudis), I18N.t('t.saudis')],
    ];

    var half = '';
    for (var i = 0; i < facts.length; i++) {
      var tone = facts[i][0];
      half +=
        '<span class="ticker-item"><span class="' + tone + ' ax-num" dir="ltr">' +
        Fmt.escapeHtml(facts[i][1]) +
        '</span><span>' +
        Fmt.escapeHtml(facts[i][2]) +
        '</span><span class="ticker-sep">·</span></span>';
    }
    half +=
      '<span class="ticker-item ticker-item--credit">Powered by Axion<span class="ticker-sep">·</span></span>';

    document.getElementById('ticker').innerHTML =
      '<div class="ticker-track"><div class="ticker-half">' +
      half +
      '</div><div class="ticker-half" aria-hidden="true">' +
      half +
      '</div></div>';
  }

  /* --- Clock --- */
  function startClock() {
    function paint() {
      var d = new Date();
      /* en-GB in both locales: the wall shows one unambiguous 24h clock, and
         an ar-SA date would switch calendars mid-demo. */
      clockEl.textContent =
        d.toLocaleDateString('en-GB') +
        ' · ' +
        d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }
    paint();
    setInterval(paint, 10000);
  }

  function bindControls() {
    playBtn.addEventListener('click', function () {
      noteInteraction();
      setPlaying(!playing);
      // Pressing play means play now, not in ninety seconds.
      if (playing) holdUntil = 0;
    });

    resetBtn.addEventListener('click', function () {
      Board.clearLayouts();
      for (var i = 0; i < boards.length; i++) if (boards[i]) boards[i].reset();
      noteInteraction();
    });

    navHost.addEventListener('click', function (ev) {
      var item = ev.target.closest('.nav-item');
      if (!item) return;
      noteInteraction();
      show(parseInt(item.getAttribute('data-board'), 10));
    });

    /* Delegated from the document so the splash's switch and the header's
       share one handler, and so a rebuilt switch stays live. */
    document.addEventListener('click', function (ev) {
      var btn = ev.target.closest('.lang-btn');
      if (!btn) return;
      noteInteraction();
      I18N.set(btn.getAttribute('data-locale'));
    });

    I18N.onChange(relocalize);

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowRight') {
        noteInteraction();
        advance();
      } else if (ev.key === 'ArrowLeft') {
        noteInteraction();
        show((current - 1 + BOARDS.length) % BOARDS.length);
      } else if (ev.key === ' ') {
        ev.preventDefault();
        playBtn.click();
      } else if (ev.key === 'r' || ev.key === 'R') {
        resetBtn.click();
      } else if (ev.key === 'l' || ev.key === 'L') {
        noteInteraction();
        I18N.toggle();
      } else if (ev.key === ']') {
        nudgeScale(SCALE_STEP);
      } else if (ev.key === '[') {
        nudgeScale(-SCALE_STEP);
      } else if (ev.key === '\\') {
        scale = SCALE_DEFAULT;
        applyScale();
        flash(Math.round(scale * 100) + '%');
      }
    });

    ['pointerdown', 'wheel', 'touchstart'].forEach(function (type) {
      document.addEventListener(type, noteInteraction, { passive: true });
    });

    window.addEventListener('resize', measure);
  }

  function start() {
    if (current < 0) show(0);
    else {
      measure();
      Motion.enter(boards[current].surface);
    }
    // Leaving the splash is not board interaction: the first board runs its
    // normal slot rather than being held.
    lastInteraction = Date.now();
    holdUntil = 0;
    slideStartedAt = lastInteraction;
    setPlaying(true);
  }

  function init() {
    Data.check();
    applyScale();
    buildNav();
    buildLang();
    buildTicker();
    localizeStatic();
    startClock();
    bindControls();
    setPlaying(true);
    setInterval(slideshowTick, 200);
  }

  global.Shell = { init: init, start: start, show: show, measure: measure };
})(window);

    </script>
    <script>
/* Splash screen.

   The animated ground is a field of vertical strokes whose crest follows a few
   layered sine waves — ridge lines that read as dunes rendered out of data.
   Written by hand rather than pulled from a library because the conference
   machine has no internet. */

(function (global) {
  'use strict';

  var el = document.getElementById('splash');
  var canvas = document.getElementById('splashCanvas');
  var ctx = canvas.getContext('2d');

  /* Left alone, the splash hands the wall back to the slideshow. Without this
     an unattended stand would sit on a static screen for the rest of the day. */
  var ATTRACT_MS = 40000;

  var frame = 0;
  var started = 0;
  var attract = 0;

  var BAR_SPACING = 7;
  var LAYERS = [
    { amp: 0.1, freq: 0.0022, speed: 0.00019, base: 0.54, alpha: 0.42, color: [57, 215, 245] },
    { amp: 0.14, freq: 0.0012, speed: -0.00011, base: 0.68, alpha: 0.3, color: [72, 140, 205] },
    { amp: 0.2, freq: 0.0006, speed: 0.00007, base: 0.84, alpha: 0.22, color: [40, 70, 110] },
  ];

  function resize() {
    var dpr = Math.min(2, global.devicePixelRatio || 1);
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw(now) {
    var w = canvas.clientWidth;
    var h = canvas.clientHeight;
    var t = now - started;

    ctx.clearRect(0, 0, w, h);

    // Far layers first, so nearer ridges overlap them.
    for (var l = LAYERS.length - 1; l >= 0; l--) {
      var layer = LAYERS[l];
      var baseline = h * layer.base;

      for (var x = 0; x <= w; x += BAR_SPACING) {
        var phase = x * layer.freq + t * layer.speed;
        var crest =
          Math.sin(phase) * 0.6 + Math.sin(phase * 2.3 + 1.7) * 0.26 + Math.sin(phase * 0.37) * 0.44;
        var top = baseline - crest * h * layer.amp;
        if (top >= h) continue;

        // Strokes dim toward the edges so the ridge reads as depth, not a band.
        var falloff = 1 - Math.min(1, Math.abs(x / w - 0.5) * 1.4);
        var alpha = layer.alpha * (0.3 + falloff * 0.7);
        var rgb = layer.color.join(',');

        var gradient = ctx.createLinearGradient(0, top, 0, h);
        gradient.addColorStop(0, 'rgba(' + rgb + ',' + alpha.toFixed(3) + ')');
        gradient.addColorStop(0.18, 'rgba(' + rgb + ',' + (alpha * 0.5).toFixed(3) + ')');
        gradient.addColorStop(1, 'rgba(' + rgb + ',0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(x, top, 2, h - top);
      }
    }

    frame = requestAnimationFrame(draw);
  }

  function play() {
    if (frame) return;
    resize();
    started = performance.now();
    frame = requestAnimationFrame(draw);
  }

  function stop() {
    if (!frame) return;
    cancelAnimationFrame(frame);
    frame = 0;
  }

  function visible() {
    return !el.hidden;
  }

  function hide() {
    if (el.hidden) return;
    clearTimeout(attract);
    el.setAttribute('data-leaving', '');
    setTimeout(function () {
      el.hidden = true;
      stop();
      Shell.start();
    }, 520);
  }

  function show() {
    clearTimeout(attract);
    attract = setTimeout(hide, ATTRACT_MS);
    if (!el.hidden) return;

    el.hidden = false;
    // Let `hidden` clear before the transition target is removed.
    requestAnimationFrame(function () {
      el.removeAttribute('data-leaving');
      play();
    });
  }

  function init() {
    document.getElementById('splashStart').addEventListener('click', hide);
    global.addEventListener('resize', function () {
      if (!el.hidden) resize();
    });
    attract = setTimeout(hide, ATTRACT_MS);
    play();
  }

  global.Splash = { init: init, show: show, hide: hide, visible: visible };
})(window);

    </script>
    <script>
      document.getElementById('splashStat1').textContent = Fmt.grouped(Data.head.eco);
      document.getElementById('splashStat2').textContent = Fmt.grouped(Data.head.reg);
      document.getElementById('splashStat3').textContent = Fmt.grouped(Data.tuv.surveyed);

      Shell.init();
      Splash.init();
    </script>
