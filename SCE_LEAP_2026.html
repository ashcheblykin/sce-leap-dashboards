:root {
  /* --- SCE palette --- */
  --cy: #39d7f5;
  --gold: #d4af5a;
  --green: #3ee6a4;
  --purple: #b48af5;
  --tx: #e9f4fb;
  --tx-2: #bcd8ea;
  --mut: #7fa8c2;
  --mut-2: #5d86a3;
  --sce-navy: #233755;

  --cy-rgb: 57, 215, 245;
  --ink: #03101f;

  --bg: radial-gradient(1900px 1100px at 50% 26%, #062036 0%, #03101f 55%, #020813 100%);
  --scanline: repeating-linear-gradient(0deg, transparent 0 3px, rgba(var(--cy-rgb), 0.012) 3px 4px);

  /* --- Axion structure ---
     One 4px-stepped scale (4/8/12/16) so nested corners can be derived from
     it rather than picked by eye. */
  --radius-card: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --radius-xs: 4px;
  --radius-pill: 999px;

  --hairline: 0.5px;
  --panel-border: rgba(var(--cy-rgb), 0.18);
  --panel-border-strong: rgba(var(--cy-rgb), 0.3);
  --separator: rgba(var(--cy-rgb), 0.12);

  --surface: linear-gradient(165deg, rgba(7, 34, 58, 0.72), rgba(4, 21, 37, 0.82));
  --surface-flat: rgba(4, 24, 43, 0.84);
  --control: rgba(var(--cy-rgb), 0.06);
  --control-hover: rgba(var(--cy-rgb), 0.12);
  --track: rgba(var(--cy-rgb), 0.1);

  /* One scaling unit drives every size, so the board is designed once at
     2880x1152 and still reads on a laptop preview.

     `--u-scale` is the only knob the room ever needs: the wall's real viewing
     distance is not known until the stand is built, so `[` and `]` nudge it

     larger again, which is the difference between "a dashboard on a big
     monitor" and something readable from across a stand. */

  --gap-grid: calc(8 * var(--u));

     title becomes 20u, a 12px chip 16u, an 11px axis tick 11 chart-units. At
     the default --u-scale the wall lands on 26px titles and 75px indicators. */

  --fs-chip: calc(16 * var(--u));
  --fs-label: calc(16.5 * var(--u));
  --fs-body: calc(20 * var(--u));
  --fs-note: calc(17 * var(--u));
  --fs-micro: calc(14 * var(--u));
  --fs-kpi: calc(58 * var(--u));
  --fs-kpi-sm: calc(42 * var(--u));
  --fs-kpi-lg: calc(70 * var(--u));
  --fs-hud: calc(74 * var(--u));

  /* Chart geometry unit. Every px constant in chart-dsl.js is multiplied by
     this, so Axion's ratios survive and only the scale changes: an 11px axis
     tick, a 3px bar radius and a 16px group gap keep their relationship at any
     resolution. Read once per resize by Chart.refreshUnit(). */

  --chart-grid: rgba(var(--cy-rgb), 0.1);
  --chart-tick: var(--mut);
  --chart-label: var(--tx-2);
  --chart-value: var(--tx);

  /* Latin first even in Arabic: the Arabic subset carries no Latin glyphs, so
     digits and the few Latin words ("LEAP 2026", "SAR") need the fallback. */

*,
*::before,
*::after {

  margin: 0;
  padding: 0;

html,
body {

  overflow: hidden;
}

body {
  background: var(--bg) fixed;
  color: var(--tx);
  font: 400 14px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Command-centre scanline, above content but inert. */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 900;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
}

   own LTR order inside Arabic copy — Axion's NUMERIC_ISOLATE. */
.num,
.ax-num,
.ax-kpi-value,
.hud-value {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;

.ax-num,
.num {

/* The Arabic subset carries no Latin glyphs, so the stack keeps 'Noto Sans'
   behind it for digits, "LEAP 2026" and "SAR". */

.ar {

/* Arabic sits lower and taller than Latin at the same size; a touch less
   letter-spacing and a touch more leading keeps the two boards the same
   density rather than making the Arabic one look crowded. */
[dir='rtl'] body,
.ar {

::-webkit-scrollbar {
  width: 6px;

::-webkit-scrollbar-thumb {

  width: 1px;
  height: 1px;
  overflow: hidden;

    <style>
/* Ported from axion.gen.web frontend/src/shared/ui/grid/grid.css.
   Geometry is a CSS calc() over container-query units, so a horizontal resize
   relays out entirely in CSS and only the row height is touched by JS. */

/* `container-type: size` (not just inline-size) so the row pitch can be derived
   from 100cqh. The board then fills its stage exactly, at 2880x1152 or any
   other height, with no JavaScript in the loop. */
[data-grid-surface] {
  position: relative;
  width: 100%;
  height: 100%;
  container-type: size;
}

[data-grid-item] {
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  --grid-unit-x: calc((100cqw + var(--grid-gap)) / var(--grid-cols));
  --grid-unit-y: calc((100cqh + var(--grid-gap)) / var(--grid-rows));
  width: calc(var(--grid-item-w) * var(--grid-unit-x) - var(--grid-gap));
  height: calc(var(--grid-item-h) * var(--grid-unit-y) - var(--grid-gap));
  transform: translate(
    calc(var(--grid-item-x) * var(--grid-unit-x)),
    calc(var(--grid-item-y) * var(--grid-unit-y))
  );
}

/* Only during a gesture do widgets ease between snap steps. At rest there is
   deliberately no geometry transition, so a window resize tracks 100cqw
   instantly and the gaps never breathe. */
body.grid-dragging [data-grid-item] {
  transition:
    transform var(--dur-fast) var(--ease),
    width var(--dur-fast) var(--ease),
    height var(--dur-fast) var(--ease),
    box-shadow var(--dur-fast) var(--ease);
}

body.grid-dragging {
  user-select: none;
  cursor: grabbing;
}

[data-grid-item][data-moving] {
  z-index: 40;
}

[data-resize-handle] {
  position: absolute;
  z-index: 5;
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease);
}

[data-grid-item]:hover [data-resize-handle],
[data-grid-item][data-resizing] [data-resize-handle] {
  opacity: 1;
}

[data-resize-handle='s'] {
  left: 14px;
  right: 14px;
  bottom: -3px;
  height: 8px;
  cursor: ns-resize;
}

[data-resize-handle='e'] {
  top: 14px;
  bottom: 14px;
  right: -3px;
  width: 8px;
  cursor: ew-resize;
}

[data-resize-handle='w'] {
  top: 14px;
  bottom: 14px;
  left: -3px;
  width: 8px;
  cursor: ew-resize;
}

[data-resize-handle='se'] {
  right: -3px;
  bottom: -3px;
  width: 16px;
  height: 16px;
  cursor: nwse-resize;
}

[data-resize-handle='sw'] {
  left: -3px;
  bottom: -3px;
  width: 16px;
  height: 16px;
  cursor: nesw-resize;
}

/* Axion's resize affordance: a short dash that grows while dragging. */
[data-resize-handle]::after {
  content: '';
  position: absolute;
  inset: 0;
  margin: auto;
  border-radius: var(--radius-pill);
  background: rgba(var(--cy-rgb), 0.55);
  transition:
    width var(--dur) cubic-bezier(0.34, 1.56, 0.64, 1),
    height var(--dur) cubic-bezier(0.34, 1.56, 0.64, 1),
    filter var(--dur) ease;
}

[data-resize-handle='s']::after,
[data-resize-handle='n']::after {
  width: 28px;
  height: 3px;
}

[data-resize-handle='e']::after,
[data-resize-handle='w']::after {
  width: 3px;
  height: 28px;
}

[data-resize-handle='se']::after,
[data-resize-handle='sw']::after {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: rgba(var(--cy-rgb), 0.4);
}

[data-grid-item][data-resizing] [data-resize-handle]::after {
  filter: drop-shadow(0 0 8px rgba(var(--cy-rgb), 0.6));
}

    <style>
/* Widget card anatomy mirrors axion.gen.web
   frontend/src/shared/ui/grid/Widget.tsx: 16px radius, 0.5px hairline, 12px
   padding, a header row separated by a hairline that doubles as the drag
   handle, and a flex body that owns all remaining height. */

/* The card is the grid item's only in-flow child and must take all of it —
   otherwise short content shrinks the card and tall content spills past it. */
.widget {
  display: flex;
  flex: 1;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
  gap: var(--pad-card);
  overflow: hidden;
  padding: var(--pad-card);
  border: var(--hairline) solid var(--panel-border);
  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow:
    var(--glow-spectrum),
    inset 0 0 30px rgba(var(--cy-rgb), 0.03);
  transition: box-shadow var(--dur-fast) var(--ease);
}

[data-grid-item][data-moving] .widget,
[data-grid-item][data-resizing] .widget {
  border-color: var(--panel-border-strong);
  box-shadow:
    var(--glow-drag),
    0 0 0 1px rgba(var(--cy-rgb), 0.4);
}

.widget-head {
  display: flex;
  flex: none;
  align-items: center;
  justify-content: space-between;
  gap: calc(8 * var(--u));
  padding-bottom: var(--pad-card);
  border-bottom: var(--hairline) solid var(--separator);
  cursor: grab;
  user-select: none;
}

body.grid-dragging .widget-head {
  cursor: grabbing;
}

/* Axion's card title is sentence case, near-white and quiet, so the numbers in
   the body are the loudest thing on the panel. The tracked cyan uppercase this
   replaces is the house style of a control room, not of a product; the cyan
   moves to the mark on the left, where it still says SCE without shouting. */
.widget-title {
  display: flex;
  overflow: hidden;
  min-width: 0;
  align-items: center;
  gap: calc(9 * var(--u));
  color: var(--tx);
  font-size: var(--fs-title);
  font-weight: 600;
  letter-spacing: 0.005em;
  white-space: nowrap;
}

.widget-title::before {
  width: calc(3 * var(--u));
  height: calc(15 * var(--u));
  flex: none;
  border-radius: var(--radius-pill);
  background: var(--cy);
  box-shadow: 0 0 calc(8 * var(--u)) rgba(var(--cy-rgb), 0.55);
  content: '';
}

.widget-title .label {
  overflow: hidden;
  min-width: 0;
  flex-shrink: 1;
  text-overflow: ellipsis;
}

/* Shrinks far faster than the primary label, so a narrow header gives up the
   other-language gloss rather than truncating the name of the panel. */
.widget-title .gloss {
  overflow: hidden;
  min-width: 0;
  /* Absorbs essentially all the shrink: the panel's own name is the last thing
     a narrow header gives up. */
  flex-shrink: 1000;
  color: var(--mut-2);
  font-size: 0.85em;
  font-weight: 400;
  letter-spacing: 0;
  text-overflow: ellipsis;
}

/* Body height is fixed by flex before any view renders, so switching a view
   swaps only the inner content and the panel geometry never moves.

   It is also the container the body's own type measures against: with the
   scale raised to product size, a headline that fits a three-row panel would
   burst a two-row one, so the pieces that can dominate a panel -- indicator
   values, gauge and donut centres -- are capped against this box rather than
   trusting the design unit alone. */
.widget-body {
  position: relative;
  display: flex;
  overflow: hidden;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  container-type: size;
}

.widget-view {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
}

/* --- Frosted chips, from Axion's FROSTED_PILL --- */
/* One segmented control rather than loose buttons, which is how Axion switches
   a widget's view and what makes the row read as a product affordance. */
.chips {
  /* Single source for the track's inset — read by the pill's position
     *and* by its radius below, so the two can never drift apart the way a
     hardcoded pixel figure eventually does. Concentric corners are
     outerRadius - inset, not a second radius token picked by eye. */

  position: relative;
  display: flex;
  flex: none;
  gap: calc(2 * var(--u));
  padding: var(--track-pad);
  border: var(--hairline) solid var(--separator);
  border-radius: var(--radius-md);
  background: var(--track);
  /* the pill can pop slightly past its own edges on press */
  overflow: visible;
  touch-action: pan-y;

   by JS (left/right) so the highlight glides between segments instead of
   jump-cutting. --pl/--pr/--pt/--pe are retuned per-gesture from JS so a
   drag can be instantaneous while a tap keeps the liquid-stretch glide. */
.chip-pill {
  position: absolute;
  top: var(--track-pad);
  bottom: var(--track-pad);
  left: 0;
  right: 0;
  z-index: 0;
  border-radius: calc(var(--radius-md) - var(--track-pad));
  background-color: var(--chip-fill);
  pointer-events: none;
  transform: translateZ(0);
  --pl: var(--chip-dur-trail);
  --pr: var(--chip-dur-trail);
  --pt: var(--chip-dur-press);
  --pe: var(--chip-ease);
  transition:
    left var(--pl) var(--chip-ease),
    right var(--pr) var(--chip-ease),
    transform var(--pt) var(--pe),
    background-color var(--dur-fast) var(--chip-ease),
    box-shadow var(--dur-fast) var(--chip-ease);
}

@media (prefers-reduced-motion: reduce) {
  .chip-pill,
  .chip {
    transition: none !important;
  }
}

.chip {
  position: relative;
  z-index: 1;
  padding: calc(5 * var(--u)) calc(13 * var(--u));
  border: var(--hairline) solid transparent;
  border-radius: calc(var(--radius-md) - var(--track-pad));
  color: var(--mut);
  font-size: var(--fs-chip);
  font-weight: 500;
  letter-spacing: 0.02em;
  white-space: nowrap;
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease);
}

.chip:hover {
  background: var(--control-hover);
  color: var(--tx);
}

.chip[data-on] {
  color: var(--cy);
  font-weight: 600;
}

.chip[data-on]:hover {
  background: none;
}

/* --- Short cards ---------------------------------------------------------
   At the raised type scale a two-row panel spends a quarter of its height on
   the header and its own padding, which left the chart 84px and a donut the
   size of a coin. The card is a size container, so a short one tightens its
   chrome and hands the difference to the content. The thresholds are in px
   because they are about how much room is left, not about the design unit. */

[data-grid-item] {
  container-type: size;
}

@container (max-height: 280px) {
  .widget {
    gap: calc(9 * var(--u));
    padding: calc(11 * var(--u));
  }

  .widget-head {
    padding-bottom: calc(8 * var(--u));
  }

  .widget-title {
    font-size: calc(16 * var(--u));
    gap: calc(7 * var(--u));
  }

  .widget-title::before {
    height: calc(12 * var(--u));
  }

  .chip {
    padding: calc(3 * var(--u)) calc(9 * var(--u));
    font-size: calc(13 * var(--u));
  }

  .chips {
    --track-pad: calc(2 * var(--u));
  }

   truncates its own name. Chips are the smaller thing on the row, so they are
   the ones that give way. */
@container (max-width: 760px) {
  .chip {
    padding: calc(4 * var(--u)) calc(9 * var(--u));
    font-size: calc(13.5 * var(--u));
  }

  .chips {
    --track-pad: calc(2 * var(--u));
  }
}

    <style>
/* Chart DSL styling — the CSS half of assets/js/core/chart-dsl.js.

   Only two jobs here. The SVG kinds get a frame that hands the renderer an
   exact pixel box and nothing else (all their geometry is computed in JS, from
   Axion's own constants). The HTML kinds — progress bars, table, indicator —
   ARE styling, so their anatomy lives here, matching
   ProgressBarsChart.tsx / TableChart.tsx / IndicatorChart.tsx and the shadcn
   table those two lean on.

   Everything that can dominate a panel is capped against its own container
   (`min(token, N cqh)`): the same markup runs one-up in a tall panel and
   four-up in a short one, so a headline has to measure itself against the box
   it landed in rather than against the design unit alone. */

/* --- Frame ---------------------------------------------------------------- */

/* Always a column: the plot row (which may carry a side legend) and the note
   under it. Without this shell a side legend and a note become two columns
   flanking the plot, and the plot gets nothing. */
.ax-chart-shell {
  display: flex;
  flex: 1;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
}

.ax-chart {
  display: flex;
  flex: 1;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
}

.ax-chart--h {
  flex-direction: row;
  align-items: stretch;
}

.ax-chart--right {
  flex-direction: row-reverse;
}

/* A panel taller than it is wide has no room for a legend beside the plot, so
   it goes underneath — the adaptive donut layout from the SCE prototypes. */
[data-orient='col'] .ax-chart--h {
  flex-direction: column;
}

[data-orient='col'] .ax-chart--right {
  flex-direction: column;
}

/* The renderer is handed this box's size and paints absolutely inside it, so
   the SVG can never feed its own height back into layout and oscillate. */
.ax-chart-area {
  position: relative;
  overflow: hidden;
  flex: 1;
  min-width: 0;
  min-height: 0;
}

.ax-svg {
  position: absolute;
  inset: 0;
  /* Charts are laid out in LTR space and mirror their coordinates explicitly,
     so pin the frame the way SVG_LTR_FRAME does and the ambient dir can never
     flip text-anchor semantics out from under the renderer. */
  direction: ltr;
  overflow: visible;
}

.ax-grid line,
.ax-grid path {
  stroke: var(--chart-grid);
  stroke-width: 1;
  fill: none;
}

.ax-axis-line {
  stroke: var(--chart-grid);
  stroke-width: 1;
}

.ax-chart-note {
  flex: none;
  padding-top: calc(6 * var(--u));
  color: var(--mut-2);
  font-size: min(var(--fs-micro), 11cqh);
  line-height: 1.3;
}

/* --- Legend (shared/legend.tsx) ------------------------------------------ */

.ax-legend {
  display: flex;
  overflow: hidden;
  flex: none;
  flex-wrap: wrap;
  justify-content: center;
  gap: calc(3 * var(--u)) calc(16 * var(--u));
  color: var(--mut);
  font-size: min(var(--fs-note), 13cqh);
}

.ax-legend--bottom {
  padding-top: calc(10 * var(--u));
}

.ax-legend--top {
  padding-bottom: calc(10 * var(--u));
}

/* A side legend is a column that shares the row with the plot. */
.ax-legend--left,
.ax-legend--right {
  display: flex;
  min-width: 0;
  max-width: 42%;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: center;
  gap: calc(7 * var(--u));
  padding-inline-start: calc(14 * var(--u));
}

.ax-legend--left {
  padding-inline-start: 0;
  padding-inline-end: calc(14 * var(--u));
}

[data-orient='col'] .ax-legend--left,
[data-orient='col'] .ax-legend--right {
  max-width: 100%;
  flex-direction: row;
  flex-wrap: wrap;
  padding: calc(10 * var(--u)) 0 0;
}

.ax-legend-item {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: calc(6 * var(--u));
}

.ax-legend-dot {
  width: calc(10 * var(--u));
  height: calc(10 * var(--u));
  flex: none;
}

.ax-legend-label {
  overflow: hidden;
  flex: 1;
  color: var(--tx-2);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ax-legend-value {
  flex: none;
  color: var(--tx);
  font-weight: 600;

.ax-mark,
.ax-mark-label,
.ax-mark-radial,
.ax-sankey-links,
.ax-line {

    opacity var(--dur-enter) var(--ease),

.ax-mark-label.is-entering {
  opacity: 0;
}

.ax-mark-radial.is-entering {
  opacity: 0;
  transform: scale(0.94);
}

.ax-sankey-links.is-entering {
  opacity: 0;
}

.ax-line.is-entering {
  stroke-dashoffset: 1;

.ax-line {
  stroke-dashoffset: 0;

/* --- Progress bars (ProgressBarsChart.tsx) -------------------------------
   Equal grid rows rather than a stack: the same list renders three deep in a

/* Tile stagger. `--enter-delay` is written per widget in reading order on the
   way in and in reverse on the way out. */

    translate: 0 0;

  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.splash-logo {
  height: calc(96 * var(--u));
  filter: drop-shadow(0 0 40px rgba(var(--cy-rgb), 0.2));
}

.splash-eyebrow {
  margin-top: calc(30 * var(--u));
  color: var(--cy);
  font-size: calc(18 * var(--u));
  font-weight: 500;
  letter-spacing: 0.42em;
  text-transform: uppercase;
}

.splash-title {
  max-width: calc(1500 * var(--u));
  margin-top: calc(20 * var(--u));
  background: linear-gradient(180deg, #ffffff 0%, #9dd6ee 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-size: calc(86 * var(--u));
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1.08;
}

.splash-title b {
  font-weight: 700;
}

.splash-sub {
  max-width: calc(880 * var(--u));
  margin-top: calc(22 * var(--u));
  color: var(--tx-2);
  font-size: calc(24 * var(--u));
  font-weight: 300;
  line-height: 1.55;
}

.splash-cta {
  display: flex;
  align-items: center;
  gap: calc(16 * var(--u));
  padding: calc(22 * var(--u)) calc(56 * var(--u));
  border: var(--hairline) solid rgba(var(--cy-rgb), 0.55);
  border-radius: var(--radius-pill);
  margin-top: calc(46 * var(--u));
  background: rgba(var(--cy-rgb), 0.12);
  box-shadow:
    0 0 40px rgba(var(--cy-rgb), 0.16),
    var(--glow-spectrum);
  backdrop-filter: var(--blur-glass);
  color: var(--tx);
  font-size: calc(22 * var(--u));
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transition:
    background var(--dur) var(--ease),
    box-shadow var(--dur) var(--ease),
    scale var(--dur) var(--ease);
}

.splash-cta:hover {
  background: rgba(var(--cy-rgb), 0.2);
  box-shadow: 0 0 64px rgba(var(--cy-rgb), 0.28);
  scale: 1.02;
}

.splash-cta svg {
  width: calc(20 * var(--u));
  height: calc(20 * var(--u));
  fill: var(--cy);
}

.splash-stats {
  display: flex;
  gap: calc(64 * var(--u));
  margin-top: calc(56 * var(--u));
}

.splash-stat-value {
  color: var(--tx);
  font-size: calc(42 * var(--u));
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.splash-stat-label {
  margin-top: calc(5 * var(--u));
  color: var(--mut);
  font-size: calc(15 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.splash-foot {
  position: absolute;
  bottom: calc(28 * var(--u));
  left: 50%;
  color: rgba(var(--cy-rgb), 0.34);
  font-size: var(--fs-micro);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  translate: -50% 0;
}

/* Content rises once, on first paint. */
.splash-inner > * {
  animation: splash-rise 700ms var(--ease) backwards;
}

.splash-inner > *:nth-child(1) { animation-delay: 60ms; }
.splash-inner > *:nth-child(2) { animation-delay: 140ms; }
.splash-inner > *:nth-child(3) { animation-delay: 220ms; }
.splash-inner > *:nth-child(4) { animation-delay: 300ms; }
.splash-inner > *:nth-child(5) { animation-delay: 380ms; }
.splash-inner > *:nth-child(6) { animation-delay: 460ms; }

@keyframes splash-rise {
  from {
    opacity: 0;
    translate: 0 calc(18 * var(--u));
  }
}

@media (prefers-reduced-motion: reduce) {
  .splash-inner > * {
    animation: none;
  }
}

/* The attract screen's own language switch, in the corner opposite the logo's
   optical centre so it never competes with the headline. */
.lang--splash {
  z-index: 3;
  position: absolute;
  top: calc(28 * var(--u));
  inset-inline-end: calc(34 * var(--u));
  background: rgba(4, 24, 43, 0.55);
  backdrop-filter: var(--blur-glass);
}

    </style>

/* Number formatting, following axion.gen.web
   frontend/src/shared/ui/charts/dsl/format.ts: values at or above 10,000 go
   compact (8006090 -> 8.01M), smaller ones stay grouped, and a hyphen-minus is
   always upgraded to a typographic minus. */

(function (global) {
  'use strict';

  var MINUS = '\u2212';

  function withMinus(s) {
    return s.replace(/-/g, MINUS);
  }

  function grouped(n) {
    return withMinus(Math.round(n).toLocaleString('en-US'));
  }

  /* Trailing zeros are only ever noise after a decimal point. Stripping them
     from the integer part turns 430k into 43k, which is exactly the kind of
     error nobody catches on a wall until the client does. */
  function trimZeros(s) {
    if (s.indexOf('.') === -1) return s;
    return s.replace(/0+$/, '').replace(/\.$/, '');
  }

  function compact(n) {
    var abs = Math.abs(n);

      [1e9, 'B'],
      [1e6, 'M'],
      [1e3, 'k'],
    ];

      if (abs >= units[i][0]) {
        var v = n / units[i][0];
        var digits = Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2;

      }

    return withMinus(n.toFixed(digits === undefined ? 1 : digits)) + '%';
  }

  function sar(millions) {
    return withMinus(trimZeros(millions.toFixed(2))) + 'M';
  }

     face and RTL isolation apply without leaking into the surrounding line. */
  function ar(text) {
    return '<span class="ar" dir="rtl">' + text + '</span>';

     NUMERIC_ISOLATE (shared/ChartText.tsx): without it a value like
     "11.4M SAR" reorders its sign, separators and unit in an Arabic line. */
  function num(text) {
    return '<span class="ax-num" dir="ltr">' + text + '</span>';
  }

    return withMinus(n.toFixed(1));
  }

    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });

     and mean the same function (the `format` field of Axion's DSL). */

    grouped: grouped,
    compact: compact,
    pct: pct,

   duration, so a 1,116,186 and a 402 finish on exactly the same frame. This is
   the point Slava made in the kick-off: driving each counter at its own speed
   makes the board look like one eye blinking before the other. */

  'use strict';

  var DURATION = 600;

  var active = [];
  var frame = 0;
  var startedAt = 0;

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);

  function tick(now) {
    var t = Math.min(1, (now - startedAt) / DURATION);
    var eased = easeOutCubic(t);

    for (var i = 0; i < active.length; i++) {
      var c = active[i];
      c.el.textContent = c.format(c.from + (c.to - c.from) * eased);
    }

    if (t < 1) {
      frame = requestAnimationFrame(tick);
      return;
    }

    // Land on the exact value rather than whatever the easing produced.
    for (var j = 0; j < active.length; j++) {
      active[j].el.textContent = active[j].format(active[j].to);

    active = [];

   * Prefixes and suffixes stay in sibling nodes so only the digits move.
   */

      // Snap anything mid-flight to its target before starting the next board.
      for (var k = 0; k < active.length; k++) {

      frame = 0;

      var el = nodes[i];

      if (!isFinite(to)) continue;

  /* --- annular sector (visx Arc / Pie) ------------------------------------ */

    /* Zero points up and angles run clockwise, matching d3-shape's pie. */
    return [cx + r * Math.sin(angle), cy - r * Math.cos(angle)];
  }

  /**
   * Annular sector path. Corner rounding is applied by the caller as a stroke
   * of width 2*cornerRadius with round joins over an inset sector -- the
   * standard trick, and exact for this shape.
   */
  function sectorPath(cx, cy, r0, r1, a0, a1) {
    if (r1 <= 0 || a1 - a0 <= 1e-9) return '';
    var full = a1 - a0 >= 2 * Math.PI - 1e-9;
    if (full) {
      /* Two half-circles, so a whole-circle slice still renders. */
      var d = 'M' + (cx) + ',' + (cy - r1) +
        'A' + r1 + ',' + r1 + ' 0 1 1 ' + cx + ',' + (cy + r1) +
        'A' + r1 + ',' + r1 + ' 0 1 1 ' + cx + ',' + (cy - r1);
      if (r0 > 0) {
        d += 'M' + cx + ',' + (cy - r0) +
          'A' + r0 + ',' + r0 + ' 0 1 0 ' + cx + ',' + (cy + r0) +
          'A' + r0 + ',' + r0 + ' 0 1 0 ' + cx + ',' + (cy - r0);
      }
      return d + 'Z';
    }
    var large = a1 - a0 > Math.PI ? 1 : 0;
    var o0 = polar(cx, cy, r1, a0),
      o1 = polar(cx, cy, r1, a1);
    var d2 = 'M' + o0[0].toFixed(3) + ',' + o0[1].toFixed(3) +
      'A' + r1 + ',' + r1 + ' 0 ' + large + ' 1 ' + o1[0].toFixed(3) + ',' + o1[1].toFixed(3);
    if (r0 > 0) {
      var i1 = polar(cx, cy, r0, a1),
        i0 = polar(cx, cy, r0, a0);
      d2 += 'L' + i1[0].toFixed(3) + ',' + i1[1].toFixed(3) +
        'A' + r0 + ',' + r0 + ' 0 ' + large + ' 0 ' + i0[0].toFixed(3) + ',' + i0[1].toFixed(3);
    } else {
      d2 += 'L' + cx + ',' + cy;
    }
    return d2 + 'Z';
  }

  /**
   * A sector with `cornerRadius` rounding: inset the geometry by cr and give
   * the path a cr-wide round-joined stroke of its own colour.
   */
  function sectorNode(cx, cy, r0, r1, a0, a1, cornerRadius, fill, opacity) {
    var cr = Math.max(0, Math.min(cornerRadius || 0, (r1 - r0) / 2));
    var span = a1 - a0;
    var node;
    if (cr > 0 && span > 1e-9) {
      var mid = (r0 + r1) / 2;
      var angInset = Math.min(cr / Math.max(mid, 1), span / 2 - 1e-6);
      if (angInset > 0) {
        node = svg('path', {
          d: sectorPath(cx, cy, r0 + cr, r1 - cr, a0 + angInset, a1 - angInset),
          fill: fill,
          stroke: fill,
          'stroke-width': cr * 2,
          'stroke-linejoin': 'round',
        });
      }
    }
    if (!node) node = svg('path', { d: sectorPath(cx, cy, r0, r1, a0, a1), fill: fill });
    if (opacity !== undefined) node.setAttribute('opacity', opacity);
    return node;
  }

  /* --- curves ------------------------------------------------------------- */

  function linePath(points) {
    var d = '';
    for (var i = 0; i < points.length; i++) {
      d += (i === 0 ? 'M' : 'L') + points[i][0].toFixed(2) + ',' + points[i][1].toFixed(2);
    }
    return d;
  }

  /** d3 curveMonotoneX, for the enforcement trend. */
  function monotonePath(points) {
    var n = points.length;
    if (n < 3) return linePath(points);
    var dx = [],
      dy = [],
      slope = [];
    for (var i = 0; i < n - 1; i++) {
      dx.push(points[i + 1][0] - points[i][0]);
      dy.push(points[i + 1][1] - points[i][1]);
      slope.push(dx[i] ? dy[i] / dx[i] : 0);
    }
    var tangent = [slope[0]];
    for (var j = 0; j < slope.length - 1; j++) {
      var s0 = slope[j],
        s1 = slope[j + 1];
      if (s0 * s1 <= 0) tangent.push(0);
      else {
        var h0 = dx[j],
          h1 = dx[j + 1],
          h = h0 + h1;
        tangent.push((3 * h) / ((h + h1) / s0 + (h + h0) / s1));
      }
    }
    tangent.push(slope[slope.length - 1]);

    var d = 'M' + points[0][0].toFixed(2) + ',' + points[0][1].toFixed(2);
    for (var k = 0; k < n - 1; k++) {
      var t = dx[k] / 3;
      d += 'C' + (points[k][0] + t).toFixed(2) + ',' + (points[k][1] + tangent[k] * t).toFixed(2) +
        ' ' + (points[k + 1][0] - t).toFixed(2) + ',' + (points[k + 1][1] - tangent[k + 1] * t).toFixed(2) +
        ' ' + points[k + 1][0].toFixed(2) + ',' + points[k + 1][1].toFixed(2);
    }
    return d;
  }

  /* --- number formatting -------------------------------------------------- */

  function fmtOf(spec) {
    if (typeof spec === 'function') return spec;
    if (typeof spec === 'string' && Fmt.by[spec]) return Fmt.by[spec];
    return Fmt.compact;
  }

  /* ================================================================== FRAME */

  /* One observer for every chart on the board, so a resize frame batches them
     all. RO fires after layout and before paint, so rendering synchronously in
     the callback puts the chart on screen in the SAME frame as its container --
     the point of SyncParentSize's flushSync. rAF or a debounce would trail by
     a frame or two, which is exactly the lag that makes a resized panel look
     like it is catching up with the pointer. */
  var observed = new Map();
  var observer = null;

  function deliver(entries) {
    refreshUnit();
    for (var i = 0; i < entries.length; i++) {
      var entry = entries[i];
      var rec = observed.get(entry.target);
      if (!rec) continue;
      var box = entry.contentRect;
      var w = Math.round(box.width);
      var h = Math.round(box.height);
      if (rec.w === w && rec.h === h) continue;
      rec.w = w;
      rec.h = h;
      if (w > 0 && h > 0) rec.draw(w, h, false);
    }
  }

  function observe(el, draw) {
    if (!observer) observer = new ResizeObserver(deliver);
    observed.set(el, { draw: draw, w: 0, h: 0 });
    observer.observe(el);
  }

  function unobserve(el) {
    observed.delete(el);
    if (observer) observer.unobserve(el);
  }

  /** ChartLegend from shared/legend.tsx: a dot and a label per series. */
  function legendNode(items, position) {
    var wrap = html('div', 'ax-legend ax-legend--' + (position || 'bottom'));
    for (var i = 0; i < items.length; i++) {
      var row = html('div', 'ax-legend-item');
      var dot = svg('svg', { width: 10, height: 10, class: 'ax-legend-dot' });
      dot.appendChild(svg('circle', { cx: 5, cy: 5, r: 4.5, fill: items[i].color }));
      row.appendChild(dot);
      var label = html('span', 'ax-legend-label', items[i].label);
      if (items[i].rtl) label.setAttribute('dir', 'rtl');
      row.appendChild(label);
      if (items[i].value !== undefined) {
        row.appendChild(html('span', 'ax-legend-value ax-num', items[i].value));
      }
      wrap.appendChild(row);
    }
    return wrap;
  }

  /**
   * ChartFrame: an optional legend plus a plot area that fills what is left.
   * `render(width, height, animate)` is called on mount and on every resize.
   */
  function frame(host, opts, render) {
    host.innerHTML = '';
    var position = opts.legendPosition || 'bottom';
    var sideways = position === 'left' || position === 'right';
    /* Outer shell is always a column: the note is a caption under the whole
       chart, so it must not become a third column when the legend sits beside
       the plot. (It did, and it squeezed the plot to nothing.) */
    var shell = html('div', 'ax-chart-shell');
    var root = html('div', 'ax-chart' + (sideways ? ' ax-chart--h' : '') + ' ax-chart--' + position);

    var legend = opts.legend && opts.legend.length ? legendNode(opts.legend, position) : null;
    var area = html('div', 'ax-chart-area');

    if (legend && (position === 'top' || position === 'left')) root.appendChild(legend);
    root.appendChild(area);
    if (legend && (position === 'bottom' || position === 'right')) root.appendChild(legend);

    shell.appendChild(root);
    if (opts.note) shell.appendChild(html('div', 'ax-chart-note', opts.note));
    host.appendChild(shell);

    var canvas = null;

    function draw(w, h, animate) {
      if (canvas) canvas.remove();
      canvas = render(w, h, animate);
      if (!canvas) return;
      area.appendChild(canvas);
      /* A resize rebuilds the SVG, so any counted text inside it is back at
         zero. Only a first render animates; a redraw lands on the value. */
      if (!animate) Counter.settle(canvas);
    }

    observe(area, draw);
    /* First paint: the observer's own first delivery lands before paint, but
       drawing here too means the chart is never one frame blank. */
    var box = area.getBoundingClientRect();
    if (box.width > 0 && box.height > 0) {
      var rec = observed.get(area);
      rec.w = Math.round(box.width);
      rec.h = Math.round(box.height);
      draw(rec.w, rec.h, true);
    }
    return { area: area, redraw: draw };
  }

  /* ============================================================== CARTESIAN */

  /**
   * CartesianChart. `series[].type` is 'bar' | 'line' | 'area'; bars share a
   * band scale whose padding is solved for a 16px inter-group gap the way
   * shared/layout.ts solves it, so the gaps stay constant as the panel resizes
   * instead of scaling with it.
   */
  function cartesian(host, spec) {
    var rtl = I18N.isRtl();
    var chartId = 'c' + ++idSeq;
    var series = spec.series || [];
    var colors = spec.colors || COLORS;
    var resolved = series.map(function (s, i) {
      return s.color || colors[i % colors.length];
    });
    var horizontal = !!spec.horizontal;
    var stacked = spec.stack === 'bar' || spec.stack === true;
    var showGrid = spec.showGrid !== false;
    var gridDirection = spec.gridDirection || 'rows';

    var bars = [],
      lines = [],
      areas = [];
    series.forEach(function (s, i) {
      var entry = { def: s, color: resolved[i], index: i };
      if (s.type === 'line') lines.push(entry);
      else if (s.type === 'area') areas.push(entry);
      else bars.push(entry);
    });

    var categories = spec.xAxis && spec.xAxis.domain
      ? spec.xAxis.domain
      : (series[0] ? series[0].data.map(function (d) { return d.x; }) : []);

    var valueFmt = fmtOf(spec.yAxis && spec.yAxis.tickFormat);
    var categoryFmt = spec.xAxis && spec.xAxis.tickFormat ? fmtOf(spec.xAxis.tickFormat) : String;

    var legend = spec.showLegend === false || series.length < 2
      ? null
      : series.map(function (s, i) {
          return { label: s.label || s.key, color: resolved[i] };
        });

    /* Value extent across every series, so bars and lines share one scale. */
    var lo = 0,
      hi = 0;
    if (stacked) {
      for (var ci = 0; ci < categories.length; ci++) {
        var stackTotal = 0;
        for (var si = 0; si < bars.length; si++) {
          var pt = bars[si].def.data[ci];
          if (pt && isFinite(pt.y)) stackTotal += pt.y;
        }
        if (stackTotal > hi) hi = stackTotal;
      }
      lines.concat(areas).forEach(function (s) {
        s.def.data.forEach(function (d) {
          if (isFinite(d.y) && d.y > hi) hi = d.y;
        });
      });
    } else {
      series.forEach(function (s) {
        s.data.forEach(function (d) {
          if (!isFinite(d.y)) return;
          if (d.y > hi) hi = d.y;
          if (d.y < lo) lo = d.y;
        });
      });
    }
    var domain = spec.yAxis && spec.yAxis.domain
      ? spec.yAxis.domain
      : niceDomain(lo, hi, (spec.yAxis && spec.yAxis.numTicks) || 5);

    return frame(host, { legend: legend, legendPosition: spec.legendPosition, note: spec.note }, function (width, height, animate) {
      var font = m(C.AXIS_FONT);
      /* computeYAxisLayout: grow the value-axis margin to the widest tick. */
      var valueTicks = linearScale(domain, [0, 1]).ticks((spec.yAxis && spec.yAxis.numTicks) || 5);
      var widestValue = 0;
      for (var t = 0; t < valueTicks.length; t++) {
        widestValue = Math.max(widestValue, measureText(valueFmt(valueTicks[t]), font));
      }
      var widestCategory = 0;
      if (horizontal) {
        for (var c = 0; c < categories.length; c++) {
          widestCategory = Math.max(widestCategory, measureText(categoryFmt(categories[c]), font));
        }
        widestCategory = Math.min(widestCategory, m(120));
      }

      var sideWidth = Math.ceil(m(C.TICK_LENGTH) + (horizontal ? widestCategory : widestValue) + m(4));
      var margin = {
        top: capMargin(width, height, MARGIN.cartesian.top),
        right: capMargin(width, height, MARGIN.cartesian.right),
        /* The bottom margin carries the category axis labels, so it is a line
           of type plus the tick gap rather than a fraction of the box. */
        bottom: Math.min(m(MARGIN.cartesian.bottom), font * 2.4),
        left: m(MARGIN.cartesian.left),
      };
      /* Category labels sit on the reading-start side, as axisSideFor does. */
      if (rtl) margin.right = Math.max(margin.right, sideWidth);
      else margin.left = Math.max(margin.left, sideWidth);
      if (horizontal) {
        /* Bars grow rightward in the LTR-pinned frame regardless of locale, so
           a positive value label always lands at the RIGHT plot edge. In RTL
           that same edge carries the category axis, so the reserve is added on
           top of the axis margin there rather than folded in with max() —
           otherwise the label sits on the category name. Straight from
           CartesianChart.tsx. */
        var reserve = m(C.H_VALUE_RESERVE);
        if (rtl) {
          margin.right += reserve;
          margin.left = Math.max(margin.left, reserve);
        } else {
          margin.right = Math.max(margin.right, reserve);
        }
      }
      if (spec.margin) {
        for (var key in spec.margin) if (spec.margin.hasOwnProperty(key)) margin[key] = m(spec.margin[key]);
      }

      var innerW = Math.max(0, width - margin.left - margin.right);
      var innerH = Math.max(0, height - margin.top - margin.bottom);
      var root = svg('svg', { width: width, height: height, class: 'ax-svg' });
      if (!innerW || !innerH) return root;

      root.appendChild(gradientDefs(chartId, resolved, horizontal));
      var plot = svg('g', { transform: 'translate(' + margin.left + ',' + margin.top + ')' });
      root.appendChild(plot);

      /* Band padding solved for a constant visual gap (shared/layout.ts). */
      var bandExtent = horizontal ? innerH : innerW;
      var grouped = !stacked && bars.length > 1;
      var targetGap = m(C.GROUP_GAP) - (grouped ? 2 * m(C.BAR_GAP) : 0);
      var outerPadding = bars.length
        ? computeOuterPadding(bandExtent, categories.length, targetGap)
        : (spec.xAxis && spec.xAxis.padding) || 0;

      var band = bandScale(categories, [0, bandExtent], outerPadding);
      var value = linearScale(domain, horizontal ? [0, innerW] : [innerH, 0]);
      var zero = value.scale(0);

      var innerPadding = 0;
      var subBand = null;
      if (grouped) {
        innerPadding = computeInnerPadding(band.bandwidth, bars.length, m(C.BAR_GAP));
        subBand = bandScale(
          bars.map(function (b) { return b.def.key; }),
          [0, band.bandwidth],
          innerPadding
        );
      }

      /* --- grid (visx Grid, numTicks 5) --- */
      if (showGrid) {
        var gridG = svg('g', { class: 'ax-grid' });
        var rows = gridDirection === 'rows' || gridDirection === 'both';
        var cols = gridDirection === 'columns' || gridDirection === 'both';
        var vTicks = value.ticks(5);
        for (var g = 0; g < vTicks.length; g++) {
          var vp = value.scale(vTicks[g]);
          if (horizontal ? cols : rows) {
            gridG.appendChild(
              horizontal
                ? svg('line', { x1: vp, y1: 0, x2: vp, y2: innerH })
                : svg('line', { x1: 0, y1: vp, x2: innerW, y2: vp })
            );
          }
        }
        plot.appendChild(gridG);
      }

      /* --- bars (shared/GradientBars.tsx) ---
         Bodies and stripes live in a group that grows from the zero line on a
         first render; the value labels ride in a second group that fades, so a
         growing bar never squashes its own number. */
      var barsG = svg('g', { class: 'ax-mark' + (animate ? ' is-entering' : '') });
      barsG.style.transformOrigin = horizontal ? '0px 0px' : '0px ' + innerH + 'px';
      barsG.style.setProperty('--ax-grow', horizontal ? 'scale(0.001, 1)' : 'scale(1, 0.001)');
      plot.appendChild(barsG);
      var labelsG = svg('g', { class: 'ax-mark-label' + (animate ? ' is-entering' : '') });
      plot.appendChild(labelsG);

      var radius = m(spec.barRadius === undefined ? 3 : spec.barRadius);
      var stripe = m(C.TOP_STRIPE);
      var labelFont = m(C.LABEL_FONT);
      var labelGap = m(C.LABEL_GAP);
      var showLabels = spec.barValueLabels !== false;
      var slotThickness = grouped ? subBand.bandwidth : band.bandwidth;
      var labelsAllowed =
        showLabels &&
        !stacked &&
        (horizontal ? slotThickness >= labelFont : slotThickness >= m(C.LABEL_MIN_BAR_WIDTH));

      for (var bi = 0; bi < bars.length; bi++) {
        var entry = bars[bi];
        for (var di = 0; di < categories.length; di++) {
          var datum = entry.def.data[di];
          if (!datum || !isFinite(datum.y)) continue;
          var color = datum.color || entry.color;

          var along = band.scale(categories[di]);
          if (along === undefined) continue;
          var thickness = band.bandwidth;
          if (grouped) {
            along += subBand.scale(entry.def.key);
            thickness = subBand.bandwidth;
          }

          /* Stacked segments start where the previous series ended. */
          var base = 0;
          if (stacked) {
            for (var pb = 0; pb < bi; pb++) {
              var prev = bars[pb].def.data[di];
              if (prev && isFinite(prev.y)) base += prev.y;
            }
          }
          var v0 = value.scale(base);
          var v1 = value.scale(base + datum.y);

          var x, y, w, h;
          if (horizontal) {
            x = Math.min(v0, v1);
            w = Math.abs(v1 - v0);
            y = along;
            h = thickness;
          } else {
            x = along;
            w = thickness;
            y = Math.min(v0, v1);
            h = Math.abs(v1 - v0);
          }
          if (w <= 0 || h <= 0) continue;

          /* The outermost segment of a stack carries the rounded end and the
             accent stripe; inner segments are flat and translucent. */
          var isOuter = !stacked || bi === bars.length - 1;
          var corners = horizontal
            ? { tl: false, bl: false, tr: isOuter, br: isOuter }
            : { tl: isOuter, tr: isOuter, bl: false, br: false };

          var body = svg('path', {
            d: roundedRect(x, y, w, h, radius, corners),
            fill: stacked && !isOuter ? color : gradientUrl(chartId, color),
            'fill-opacity': stacked && !isOuter ? C.STACK_FILL_OPACITY : undefined,
          });
          barsG.appendChild(body);

          if (isOuter) {
            var sw = Math.min(stripe, horizontal ? w : h);
            barsG.appendChild(
              svg('rect', {
                x: horizontal ? x + w - sw : x,
                y: horizontal ? y : y,
                width: horizontal ? sw : w,
                height: horizontal ? h : sw,
                fill: color,
              })
            );
          }

          if (labelsAllowed) {
            var labelText = (spec.barValueFormat ? fmtOf(spec.barValueFormat) : valueFmt)(datum.y);
            if (horizontal) {
              labelsG.appendChild(
                text({
                  x: x + w + labelGap,
                  y: y + h / 2,
                  align: 'start',
                  logical: false,
                  value: labelText,
                  size: labelFont,
                  fill: color,
                  kind: 'numeric',
                  baseline: 'central',
                })
              );
            } else {
              labelsG.appendChild(
                text({
                  x: x + w / 2,
                  y: y - labelGap,
                  align: 'middle',
                  value: labelText,
                  size: labelFont,
                  fill: color,
                  kind: 'numeric',
                  baseline: 'alphabetic',
                })
              );
            }
          }
        }
      }

      /* --- areas and lines --- */
      function pointsOf(entry) {
        var pts = [];
        for (var i = 0; i < entry.def.data.length; i++) {
          var d = entry.def.data[i];
          if (!isFinite(d.y)) continue;
          var along = band.type === 'band' ? band.center(d.x) : undefined;
          if (along === undefined) {
            /* A point/linear category axis: spread evenly, as scalePoint does. */
            along = categories.length > 1 ? (i / (categories.length - 1)) * bandExtent : bandExtent / 2;
          }
          pts.push(horizontal ? [value.scale(d.y), along] : [along, value.scale(d.y)]);
        }
        return pts;
      }

      areas.concat(lines).forEach(function (entry) {
        var pts = pointsOf(entry);
        if (pts.length < 2) return;
        var curve = entry.def.curve === 'monotoneX' ? monotonePath : linePath;
        var d = curve(pts);
        if (entry.def.type === 'area') {
          var closed = d + 'L' + pts[pts.length - 1][0].toFixed(2) + ',' + zero.toFixed(2) +
            'L' + pts[0][0].toFixed(2) + ',' + zero.toFixed(2) + 'Z';
          plot.appendChild(
            svg('path', { d: closed, fill: gradientUrl(chartId, entry.color), stroke: 'none' })
          );
        }
        plot.appendChild(
          svg('path', {
            d: d,
            fill: 'none',
            stroke: entry.color,
            'stroke-width': m(entry.def.strokeWidth || 2),
            'stroke-linejoin': 'round',
            'stroke-linecap': 'round',
            'stroke-dasharray': entry.def.strokeDasharray,
          })
        );
        /* Draw-on: pathLength=1 makes the dash pattern resolution-independent,
           so the line can be revealed without measuring it. */
        if (animate && !entry.def.strokeDasharray) {
          var stroke = plot.lastChild;
          stroke.setAttribute('pathLength', 1);
          stroke.setAttribute('stroke-dasharray', '1 1');
          stroke.setAttribute('class', 'ax-line is-entering');
        }
        if (entry.def.showDots) {
          for (var p = 0; p < pts.length; p++) {
            plot.appendChild(
              svg('circle', { cx: pts[p][0], cy: pts[p][1], r: m(3.5), fill: entry.color })
            );
          }
        }
      });

      /* --- axes (visx Axis: hairline value line, no tick marks) --- */
      var axisG = svg('g', { class: 'ax-axis' });
      plot.appendChild(axisG);

      /* Category axis. Vertical bars put it along the bottom; horizontal bars
         put it on the reading-start side. */
      if (horizontal) {
        var step = band.step;
        var everyK = step >= font * 1.35 ? 1 : Math.ceil((font * 1.35) / Math.max(step, 1));
        for (var ci2 = 0; ci2 < categories.length; ci2 += everyK) {
          var cy2 = band.center(categories[ci2]);
          axisG.appendChild(
            text({
              x: rtl ? innerW + m(C.TICK_LENGTH) + m(4) : -m(C.TICK_LENGTH) - m(4),
              y: cy2,
              align: 'end',
              rtl: rtl,
              value: truncate(categoryFmt(categories[ci2]), widestCategory, font),
              size: font,
              fill: 'var(--chart-tick)',
              baseline: 'central',
            })
          );
        }
      } else {
        axisG.appendChild(
          svg('line', { x1: 0, y1: innerH, x2: innerW, y2: innerH, class: 'ax-axis-line' })
        );
        /* Thin category labels to the band step, budgeting label width per
           step the way bandTickProps does rather than counting ticks. */
        var stepX = band.step;
        var labelBudget = Math.max(stepX - m(4), m(12));
        var strideX = 1;
        var widest = 0;
        for (var w2 = 0; w2 < categories.length; w2++) {
          widest = Math.max(widest, measureText(categoryFmt(categories[w2]), font));
        }
        if (widest > labelBudget) strideX = Math.ceil(Math.min(widest, m(72)) / Math.max(stepX, 1));
        for (var ci3 = 0; ci3 < categories.length; ci3 += strideX) {
          axisG.appendChild(
            text({
              x: band.center(categories[ci3]),
              y: innerH + font + m(10),
              align: 'middle',
              rtl: rtl,
              value: truncate(categoryFmt(categories[ci3]), Math.max(labelBudget, m(28)) * strideX, font),
              size: font,
              fill: 'var(--chart-tick)',
              baseline: 'alphabetic',
            })
          );
        }
      }

      /* Value axis: ticks only, no axis line (visx hideAxisLine). */
      var vAxis = value.ticks(5);
      for (var vi = 0; vi < vAxis.length; vi++) {
        var vpos = value.scale(vAxis[vi]);
        if (horizontal) {
          axisG.appendChild(
            text({
              x: vpos,
              y: innerH + font + m(10),
              align: 'middle',
              value: valueFmt(vAxis[vi]),
              size: font,
              fill: 'var(--chart-tick)',
              kind: 'numeric',
              baseline: 'alphabetic',
            })
          );
        } else {
          axisG.appendChild(
            text({
              x: rtl ? innerW + m(C.TICK_LENGTH) + m(4) : -m(C.TICK_LENGTH) - m(4),
              y: vpos,
              align: 'end',
              rtl: rtl,
              value: valueFmt(vAxis[vi]),
              size: font,
              fill: 'var(--chart-tick)',
              kind: 'numeric',
              baseline: 'central',
            })
          );
        }
      }

      return root;
    });
  }

  /* ==================================================================== PIE */

  /** PieChart: a donut with optional leader-line annotations. */
  function pie(host, spec) {
    var data = spec.data || [];
    var colors = spec.colors || COLORS;
    var resolved = data.map(function (d, i) {
      return d.color || colors[i % colors.length];
    });
    var total = sum(data, function (d) { return d.value; });
    var valueFmt = fmtOf(spec.valueFormat || 'compact');

    var legend =
      spec.showLegend === false
        ? null
        : data.map(function (d, i) {
            return {
              label: Labels.t(d.label),
              color: resolved[i],
              rtl: Labels.isArabic(d.label),
              value: spec.legendValues === false ? undefined : valueFmt(d.value),
            };
          });

    return frame(
      host,
      { legend: legend, legendPosition: spec.legendPosition || 'right', note: spec.note },
      function (width, height, animate) {
        var font = m(C.AXIS_FONT);
        var pad = capMargin(width, height, MARGIN.pie.top);
        var margin = { top: pad, right: pad, bottom: pad, left: pad };
        var showAnnotations = !!spec.showAnnotations;
        var reserveH = showAnnotations
          ? m(C.LABEL_OFFSET + C.ANNOTATION_GAP + C.ANNOTATION_TEXT_BUDGET)
          : 0;
        var reserveV = showAnnotations ? m(C.LEADER_RADIAL) + font : 0;
        var outer = computePieRadius(width, height, margin, reserveH, reserveV);
        var root = svg('svg', { width: width, height: height, class: 'ax-svg' });
        if (outer <= 0) return root;

        var inner = spec.donut === false ? 0 : outer * (spec.innerRadiusFraction || 0.55);
        var pad = ((spec.gap || 0) * Math.PI) / 180;
        var cx = width / 2;
        var cy = height / 2;
        var g = svg('g', { class: 'ax-mark-radial' + (animate ? ' is-entering' : '') });
        g.style.transformOrigin = cx + 'px ' + cy + 'px';
        root.appendChild(g);

        var angle = 0;
        for (var i = 0; i < data.length; i++) {
          var share = total ? data[i].value / total : 0;
          var span = share * 2 * Math.PI;
          var a0 = angle + pad / 2;
          var a1 = angle + span - pad / 2;
          angle += span;
          if (a1 <= a0) continue;

          g.appendChild(
            sectorNode(cx, cy, inner, outer, a0, a1, m(spec.cornerRadius || 0), resolved[i])
          );

          if (showAnnotations && share > 0.02) {
            var mid = (a0 + a1) / 2;
            var sin = Math.sin(mid);
            var onRight = sin >= 0;
            var p1 = polar(cx, cy, outer, mid);
            var p2 = polar(cx, cy, outer + m(C.LEADER_RADIAL), mid);
            var labelX = cx + (outer + m(C.LABEL_OFFSET)) * (onRight ? 1 : -1);
            g.appendChild(
              svg('polyline', {
                points:
                  p1[0].toFixed(1) + ',' + p1[1].toFixed(1) + ' ' +
                  p2[0].toFixed(1) + ',' + p2[1].toFixed(1) + ' ' +
                  labelX.toFixed(1) + ',' + p2[1].toFixed(1),
                fill: 'none',
                stroke: resolved[i],
                'stroke-width': 1,
              })
            );
            var avail = onRight
              ? Math.max(0, width - margin.right - labelX - m(C.ANNOTATION_GAP))
              : Math.max(0, labelX - m(C.ANNOTATION_GAP) - margin.left);
            g.appendChild(
              text({
                x: labelX + (onRight ? m(C.ANNOTATION_GAP) : -m(C.ANNOTATION_GAP)),
                y: p2[1],
                align: onRight ? 'start' : 'end',
                logical: false,
                value: truncate(Labels.t(data[i].label), avail, font),
                size: font,
                fill: 'var(--chart-label)',
                baseline: 'middle',
              })
            );
          }
        }

        /* Centre readout. Axion has no donut label; this board does, because a
           ring with the total in the hole is what the SCE prototypes showed. */
        if (spec.centerLabel && inner > 0) {
          var value = spec.centerValue === undefined ? total : spec.centerValue;
          /* The readout has to fit the hole, not just the ring: size the value
             off the hole's chord and drop the caption when it would spill over
             the arc (which is what made "REGISTERED WITH SCE" run off it). */
          var chord = inner * 1.62;
          var formatted = fmtOf(spec.centerFormat || 'compact')(value);
          var big = Math.min(m(44), inner * 0.72, (chord / Math.max(formatted.length, 3)) * 1.7);
          var capSize = Math.min(big * 0.36, m(13));
          var capFits = measureText(spec.centerLabel, capSize) <= chord;
          var vNode = text({
            x: cx,
            y: cy - big * 0.06,
            align: 'middle',
            value: '0',
            size: big,
            weight: 700,
            fill: 'var(--chart-value)',
            kind: 'numeric',
            baseline: 'middle',
            className: 'ax-num',
          });
          vNode.setAttribute('data-count', value);
          vNode.setAttribute('data-count-format', spec.centerFormat || 'compact');
          if (capFits) vNode.setAttribute('y', cy - capSize * 0.7);
          g.appendChild(vNode);
          if (capFits) {
            g.appendChild(
              text({
                x: cx,
                y: cy + big * 0.52,
                align: 'middle',
                value: spec.centerLabel,
                size: capSize,
                fill: 'var(--chart-tick)',
                baseline: 'middle',
              })
            );
          }
        }
        return root;
      }
    );
  }

  /* ================================================================== RADAR */

  function radar(host, spec) {
    /* No direction handling: a radar has no reading-order axis, and its labels
       are anchored physically by the sign of sin(angle). */
    var data = spec.data || [];
    var series = spec.series || [];
    var colors = spec.colors || COLORS;
    var resolved = series.map(function (s, i) {
      return s.color || colors[i % colors.length];
    });
    var levels = spec.levels || 4;
    var legend =
      spec.showLegend === false
        ? null
        : series.map(function (s, i) {
            return { label: s.label || s.key, color: resolved[i] };
          });

    var globalMax = 1;
    data.forEach(function (row) {
      series.forEach(function (s) {
        var v = row[s.key];
        if (isFinite(v) && v > globalMax) globalMax = v;
      });
    });

    return frame(
      host,
      { legend: legend, legendPosition: spec.legendPosition || 'bottom', note: spec.note },
      function (width, height, animate) {
        var font = m(C.AXIS_FONT);
        /* The radar's margin holds its axis labels, so it is measured from
           them rather than fixed: the widest label sets the horizontal
           reserve (capped, or a long metric name would leave no radar), one
           line of type sets the vertical one. Axion's fixed 40 is the floor
           it starts from. */
        var widestLabel = 0;
        for (var li = 0; li < data.length; li++) {
          widestLabel = Math.max(widestLabel, measureText(data[li].metric, font));
        }
        var labelGap = m(C.RADAR_LABEL_GAP);
        var base = Math.min(m(MARGIN.radar.top), Math.min(width, height) * 0.14);
        var marginX = Math.min(Math.max(base, widestLabel + labelGap), width * 0.24);
        var marginY = Math.max(base, font * 1.8);
        var radius = Math.max(
          0,
          Math.min((width - marginX * 2) / 2, (height - marginY * 2) / 2)
        );
        /* Whatever the reserve could not cover, the label gives up with an
           ellipsis rather than running off the panel. */
        var labelBudget = Math.max(width / 2 - radius - labelGap, m(24));
        var root = svg('svg', { width: width, height: height, class: 'ax-svg' });
        if (radius <= 0 || data.length < 3) return root;

        var domain = spec.radiusDomain || niceDomain(0, globalMax, levels);
        var rScale = linearScale(domain, [0, radius]);
        var cx = width / 2;
        var cy = height / 2;
        var N = data.length;
        var g = svg('g', { class: 'ax-mark-radial' + (animate ? ' is-entering' : '') });
        g.style.transformOrigin = cx + 'px ' + cy + 'px';
        root.appendChild(g);

        function point(i, r) {
          var a = (i / N) * 2 * Math.PI;
          return [cx + r * Math.sin(a), cy - r * Math.cos(a)];
        }

        if (spec.showGrid !== false) {
          var grid = svg('g', { class: 'ax-grid' });
          for (var l = 1; l <= levels; l++) {
            var rr = (radius * l) / levels;
            var ring = [];
            for (var k = 0; k < N; k++) ring.push(point(k, rr));
            grid.appendChild(svg('path', { d: linePath(ring) + 'Z', fill: 'none' }));
          }
          for (var s2 = 0; s2 < N; s2++) {
            var tip = point(s2, radius);
            grid.appendChild(svg('line', { x1: cx, y1: cy, x2: tip[0], y2: tip[1] }));
          }
          g.appendChild(grid);
        }

        for (var si = 0; si < series.length; si++) {
          var pts = [];
          for (var mi = 0; mi < N; mi++) {
            var v = data[mi][series[si].key];
            pts.push(point(mi, rScale.scale(isFinite(v) ? v : 0)));
          }
          g.appendChild(
            svg('path', {
              d: linePath(pts) + 'Z',
              fill: resolved[si],
              'fill-opacity': spec.fillOpacity === undefined ? 0.36 : spec.fillOpacity,
              stroke: resolved[si],
              'stroke-width': m(2),
              'stroke-linejoin': 'round',
            })
          );
          for (var dp = 0; dp < pts.length; dp++) {
            g.appendChild(
              svg('circle', { cx: pts[dp][0], cy: pts[dp][1], r: m(C.RADAR_DOT), fill: resolved[si] })
            );
          }
        }

        if (spec.showAxisLabels !== false) {
          for (var ai = 0; ai < N; ai++) {
            var a2 = (ai / N) * 2 * Math.PI;
            var pos = point(ai, radius + m(C.RADAR_LABEL_GAP));
            var sinA = Math.sin(a2);
            var align = Math.abs(sinA) < 0.1 ? 'middle' : sinA > 0 ? 'start' : 'end';
            g.appendChild(
              text({
                x: pos[0],
                y: pos[1],
                align: align,
                logical: false,
                value:
                  align === 'middle'
                    ? data[ai].metric
                    : truncate(data[ai].metric, labelBudget, font),
                size: font,
                fill: 'var(--chart-tick)',
                baseline: 'middle',
              })
            );
          }
        }
        return root;
      }
    );
  }

  /* ================================================================= SANKEY */

  /**
   * SankeyChart. Nodes declare their own `layer`, which is all this board's
   * graphs need (class -> status is two columns), so the layout is the
   * deterministic part of d3-sankey without the relaxation pass: stack each
   * column by value, then stack each node's links by the opposite endpoint's
   * position so ribbons cross as little as possible.
   */
  function sankey(host, spec) {
    var rtl = I18N.isRtl();
    var nodes = (spec.nodes || []).map(function (n, i) {
      return { index: i, label: n.label, color: n.color, layer: n.layer || 0 };
    });
    var links = (spec.links || []).map(function (l, i) {
      return { index: i, source: l.source, target: l.target, value: l.value, color: l.color };
    });
    var valueFmt = fmtOf(spec.valueFormat || 'compact');
    var legend = spec.legendItems && spec.legendItems.length ? spec.legendItems : null;

    return frame(
      host,
      { legend: legend, legendPosition: spec.legendPosition || 'bottom', note: spec.note },
      function (width, height, animate) {
        var font = m(C.AXIS_FONT);
        var margin = m(MARGIN.sankey.top);
        var nodeWidth = m(C.NODE_WIDTH);
        var nodePadding = m(C.NODE_PADDING);

        /* Labels sit outside the node columns, so reserve their width. */
        var labelSpace = 0;
        if (spec.showLabels !== false) {
          for (var i = 0; i < nodes.length; i++) {
            labelSpace = Math.max(labelSpace, measureText(nodes[i].label, font) + m(8));
          }
          labelSpace = Math.min(labelSpace, width * 0.22);
        }

        var left = margin + labelSpace;
        var right = width - margin - labelSpace;
        var innerW = Math.max(0, right - left);
        var innerH = Math.max(0, height - margin * 2);
        var root = svg('svg', { width: width, height: height, class: 'ax-svg' });
        if (!innerW || !innerH || !nodes.length) return root;

        /* Node totals. */
        var layers = {};
        nodes.forEach(function (n) {
          n.inValue = 0;
          n.outValue = 0;
          (layers[n.layer] = layers[n.layer] || []).push(n);
        });
        links.forEach(function (l) {
          nodes[l.source].outValue += l.value;
          nodes[l.target].inValue += l.value;
        });
        nodes.forEach(function (n) {
          n.value = Math.max(n.inValue, n.outValue);
        });

        var layerKeys = Object.keys(layers).map(Number).sort(function (a, b) { return a - b; });
        var columns = layerKeys.length;

        /* One value->pixel factor for every column, so a ribbon keeps its
           thickness end to end. */
        var ky = Infinity;
        layerKeys.forEach(function (key) {
          var col = layers[key];
          var totalValue = sum(col, function (n) { return n.value; });
          var free = innerH - (col.length - 1) * nodePadding;
          if (totalValue > 0) ky = Math.min(ky, free / totalValue);
        });
        if (!isFinite(ky) || ky <= 0) return root;

        var columnStep = columns > 1 ? (innerW - nodeWidth) / (columns - 1) : 0;
        layerKeys.forEach(function (key, ci) {
          var col = layers[key];
          var used = sum(col, function (n) { return n.value * ky; }) + (col.length - 1) * nodePadding;
          var y = margin + (innerH - used) / 2;
          col.forEach(function (n) {
            n.x0 = rtl ? right - nodeWidth - ci * columnStep : left + ci * columnStep;
            n.x1 = n.x0 + nodeWidth;
            n.y0 = y;
            n.y1 = y + n.value * ky;
            y = n.y1 + nodePadding;
          });
        });

        /* Stack links at both ends, ordered by the opposite endpoint. */
        nodes.forEach(function (n) {
          n.outLinks = [];
          n.inLinks = [];
        });
        links.forEach(function (l) {
          l.width = l.value * ky;
          nodes[l.source].outLinks.push(l);
          nodes[l.target].inLinks.push(l);
        });
        nodes.forEach(function (n) {
          n.outLinks.sort(function (a, b) { return nodes[a.target].y0 - nodes[b.target].y0; });
          n.inLinks.sort(function (a, b) { return nodes[a.source].y0 - nodes[b.source].y0; });
          var oy = n.y0;
          n.outLinks.forEach(function (l) {
            l.sy = oy + l.width / 2;
            oy += l.width;
          });
          var iy = n.y0;
          n.inLinks.forEach(function (l) {
            l.ty = iy + l.width / 2;
            iy += l.width;
          });
        });

        var linkG = svg('g', { class: 'ax-sankey-links' + (animate ? ' is-entering' : '') });
        root.appendChild(linkG);
        links.forEach(function (l) {
          var s = nodes[l.source];
          var t = nodes[l.target];
          var x0 = rtl ? s.x0 : s.x1;
          var x1 = rtl ? t.x1 : t.x0;
          var mx = (x0 + x1) / 2;
          linkG.appendChild(
            svg('path', {
              d: 'M' + x0.toFixed(1) + ',' + l.sy.toFixed(1) +
                'C' + mx.toFixed(1) + ',' + l.sy.toFixed(1) +
                ' ' + mx.toFixed(1) + ',' + l.ty.toFixed(1) +
                ' ' + x1.toFixed(1) + ',' + l.ty.toFixed(1),
              fill: 'none',
              stroke: l.color || nodes[l.source].color,
              'stroke-width': Math.max(1, l.width),
              'stroke-opacity': spec.linkOpacity === undefined ? 0.4 : spec.linkOpacity,
            })
          );
        });

        var nodeG = svg('g', { class: 'ax-sankey-nodes' });
        root.appendChild(nodeG);
        nodes.forEach(function (n) {
          var h = Math.max(1, n.y1 - n.y0);
          nodeG.appendChild(
            svg('path', {
              d: roundedRect(n.x0, n.y0, nodeWidth, h, m(3), { tl: 1, tr: 1, bl: 1, br: 1 }),
              fill: n.color,
            })
          );
          if (spec.showLabels === false) return;
          /* Labels hang outside their column: first column reads outward on
             the start side, last column on the end side. */
          var atStart = n.layer === layerKeys[0];
          var outward = rtl ? !atStart : atStart;
          nodeG.appendChild(
            text({
              x: outward ? n.x0 - m(8) : n.x1 + m(8),
              y: (n.y0 + n.y1) / 2 - font * 0.55,
              align: outward ? 'end' : 'start',
              logical: false,
              value: n.label,
              size: font,
              fill: 'var(--chart-label)',
              baseline: 'middle',
            })
          );
          nodeG.appendChild(
            text({
              x: outward ? n.x0 - m(8) : n.x1 + m(8),
              y: (n.y0 + n.y1) / 2 + font * 0.75,
              align: outward ? 'end' : 'start',
              logical: false,
              value: valueFmt(n.value),
              size: font * 0.92,
              fill: 'var(--chart-tick)',
              kind: 'numeric',
              baseline: 'middle',
            })
          );
        });
        return root;
      }
    );
  }

  /* ============================================================== SUNBURST */

  /**
   * SunburstChart. `roots` is a one-or-two level hierarchy; a parent's own
   * residual (value minus its children) keeps its angular share as an unfilled
   * wedge, which is how the d3 partition in the original behaves. Deeper rings
   * fade toward the ground so a branch reads as one hue with depth.
   */
  function sunburst(host, spec) {
    var roots = spec.roots || [];
    var valueFmt = fmtOf(spec.valueFormat || 'compact');
    var legend = spec.legendItems && spec.legendItems.length ? spec.legendItems : null;
    var total = sum(roots, function (r) { return r.value; });
    var rings = 1;
    roots.forEach(function (r) {
      if (r.children && r.children.length) rings = 2;
    });

    return frame(
      host,
      { legend: legend, legendPosition: spec.legendPosition || 'bottom', note: spec.note },
      function (width, height, animate) {
        var font = m(C.AXIS_FONT);
        var pad = capMargin(width, height, MARGIN.sunburst.top);
        var margin = { top: pad, right: pad, bottom: pad, left: pad };
        var outer = computePieRadius(width, height, margin, 0, 0);
        var root = svg('svg', { width: width, height: height, class: 'ax-svg' });
        if (outer <= 0 || !total) return root;

        var inner = outer * (spec.innerRadiusFraction || 0);
        var ringWidth = (outer - inner) / rings;
        var pad = ((spec.gap || 0) * Math.PI) / 180;
        var cx = width / 2;
        var cy = height / 2;
        var g = svg('g', { class: 'ax-mark-radial' + (animate ? ' is-entering' : '') });
        g.style.transformOrigin = cx + 'px ' + cy + 'px';
        root.appendChild(g);

        var angle = 0;
        for (var i = 0; i < roots.length; i++) {
          var node = roots[i];
          var span = (node.value / total) * 2 * Math.PI;
          var a0 = angle + pad / 2;
          var a1 = angle + span - pad / 2;
          angle += span;
          if (a1 <= a0) continue;

          g.appendChild(
            sectorNode(cx, cy, inner, inner + ringWidth, a0, a1, m(spec.cornerRadius || 0), node.color)
          );
          if (spec.showLabels !== false && (a1 - a0) * (inner + ringWidth / 2) > measureText(node.label, font)) {
            g.appendChild(arcLabel(cx, cy, inner + ringWidth / 2, (a0 + a1) / 2, node.label, font, 'var(--chart-value)'));
          }

          var kids = node.children || [];
          var childAngle = a0;
          var childSpan = a1 - a0;
          for (var j = 0; j < kids.length; j++) {
            var kid = kids[j];
            var kSpan = node.value ? (kid.value / node.value) * childSpan : 0;
            var k0 = childAngle;
            var k1 = childAngle + kSpan;
            childAngle = k1;
            if (k1 - k0 <= 1e-6) continue;
            var r0 = inner + ringWidth;
            var r1 = inner + ringWidth * 2;
            /* DEPTH_FADE from the original: ring two at 84% alpha. */
            var fill = rgba(kid.color || node.color, 1 - 0.16);
            var arcNode = sectorNode(cx, cy, r0, r1, k0, k1, m(spec.cornerRadius || 0), fill);
            /* Siblings share a hue, so a hairline in the ground separates them —
               skipped on arcs too small to survive the inset. */
            if ((k1 - k0) * ((r0 + r1) / 2) > m(C.MIN_STROKE_ARC)) {
              arcNode.setAttribute('stroke', 'var(--chart-ground)');
              arcNode.setAttribute('stroke-width', 1);
            }
            g.appendChild(arcNode);
            if (spec.showLabels !== false) {
              var mid = (k0 + k1) / 2;
              var room = (k1 - k0) * ((r0 + r1) / 2);
              var label = kid.label;
              if (room > measureText(label, font) + m(C.SUNBURST_LABEL_PAD)) {
                g.appendChild(arcLabel(cx, cy, (r0 + r1) / 2, mid, label, font, 'var(--chart-label)'));
              }
            }
          }
        }
        return root;
      }
    );
  }

  /** A label laid along an arc's mid-angle, upright and centred. */
  function arcLabel(cx, cy, r, angle, label, font, fill) {
    var pos = polar(cx, cy, r, angle);
    var node = text({
      x: pos[0],
      y: pos[1],
      align: 'middle',
      logical: false,
      value: label,
      size: font,
      fill: fill,
      baseline: 'middle',
    });
    return node;
  }

  /* =========================================================== HTML KINDS */

  /**
   * ProgressBarsChart: label and value over a track, exactly the original's
   * geometry (8px bar, 24px row gap, 4px radius, 15% track tint). HTML rather
   * than SVG for the same reason as the original -- logical flow mirrors itself
   * in RTL with no coordinate maths.
   */
  function progressBars(host, spec) {

   which cannot work on a conference machine with no internet. So the tiles are
   baked instead: assets/js/data/ksa-basemap.js holds the real Carto raster --

   projected latitude, so placing it is a plain linear mapping and the baked

      var ay = parseFloat(a.style.getPropertyValue('--grid-item-y')) || 0;
      var by = parseFloat(b.style.getPropertyValue('--grid-item-y')) || 0;

    var surface = document.createElement('div');
    surface.setAttribute('data-grid-surface', '');
    surface.setAttribute('data-board', def.id);
    host.appendChild(surface);

    var state = { layout: loadLayout(def.id, def.widgets) };

    var views = {};
    /* Some views pick a layout from the panel's proportions (a donut sits
       beside its legend in a wide panel and above it in a tall one), so the
       body carries its own orientation as an attribute. */
    var orientObserver = new ResizeObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        var box = entries[i].contentRect;
        entries[i].target.setAttribute('data-orient', box.width >= box.height * 1.35 ? 'row' : 'col');
      }
    });

    // Chip switching re-renders only the body of its own widget. Looked up
    // dynamically (not captured per loop iteration) since it's shared by
    // every widget's attachChipTabs() callback below.
    function onChipSelect(index, chipsEl) {
      var item = chipsEl.closest('[data-grid-item]');
      var entry = views[item.getAttribute('data-grid-item')];
      if (!entry || entry.current === index) return;

      entry.current = index;
      entry.def.views[index](entry.body);
      Motion.animate(entry.body);
      if (def.onInteract) def.onInteract();
    }

    var headObserver = new ResizeObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        var head = entries[i].target;
        fitGloss(head);
        var chipsEl = head.querySelector('.chips');
        if (chipsEl && chipsEl._tabs) chipsEl._tabs.snap();
      }
    });

    for (var i = 0; i < def.widgets.length; i++) {
      var w = def.widgets[i];
      var item = document.createElement('div');
      item.setAttribute('data-grid-item', w.id);
      item.innerHTML = widgetMarkup(w);
      surface.appendChild(item);

      var body = item.querySelector('.widget-body');
      orientObserver.observe(body);
      headObserver.observe(item.querySelector('.widget-head'));

      var chipsEl = item.querySelector('.chips');
      if (chipsEl) chipsEl._tabs = attachChipTabs(chipsEl, onChipSelect);

      views[w.id] = { def: w, body: body, current: 0 };
      w.views[0](body);
    }

    var grid = AxGrid.attachInteraction(surface, state, {
      cols: AxGrid.COLS,
      rows: AxGrid.ROWS,
      onCommit: function (layout) {
        saveLayout(def.id, layout);
        if (def.onInteract) def.onInteract();
      },
    });

    grid.paint(state.layout);

    function reset() {
      state.layout = loadLayout(def.id, def.widgets);
      grid.paint(state.layout);
    }

    function destroy() {
      orientObserver.disconnect();
      headObserver.disconnect();
      for (var id in views) {
        if (views.hasOwnProperty(id)) Chart.unmount(views[id].body);
      }
      surface.remove();
    }

    return {
      id: def.id,
      def: def,
      surface: surface,
      reset: reset,
      destroy: destroy,
    };
  }

    create: create,
    clearLayouts: clearLayouts,
    loadLayout: loadLayout,
  };
